name: ennote CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - flags: "-race -count=1"
          - flags: "-count=1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: cd ennoworker && go test ./... ${{ matrix.flags }}

  go-vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: cd ennoworker && go vet ./...

  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: cd ennoworker && go build ./cmd/ennogate && go build ./cmd/ennoworker

  js-lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:appshell-size

  js-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm test

  js-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: cd ennoworker && go build -o /tmp/ennogate ./cmd/ennogate && go build -o /tmp/ennoworker ./cmd/ennoworker
      - run: npx playwright install --with-deps chromium
      - name: Start gate and run e2e
        run: |
          mkdir -p /tmp/ennote-e2e-home
          PORT=45131 ENNOTE_HOSTNAME=127.0.0.1 \
            ENNOTE_STATIC_DIR="$GITHUB_WORKSPACE/out" \
            ENNOTE_HOME=/tmp/ennote-e2e-home \
            ENNOTE_WORKER_PATH=/tmp/ennoworker \
            ENNOTE_SANDBOX=none \
            /tmp/ennogate > /tmp/ennote-e2e-gate.log 2>&1 &
          GATE_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:45131/api/health > /dev/null; then break; fi
            sleep 1
          done
          npx playwright test
          STATUS=$?
          kill $GATE_PID 2>/dev/null || true
          exit $STATUS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  release-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm run release:build-worker
      - run: npm run pack:check
      - run: npm run smoke:installed
        env:
          ENNOTE_SMOKE_WORKER_DIR: ${{ github.workspace }}/worker
