name: pages

# Documentation site only. The npm package and the Worker binaries are released
# by release.yml; nothing here touches them.
on:
  push:
    branches: [main]
    paths:
      - "manual/**"
      - "mkdocs.yml"
      - "mkdocs-requirements.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs
        run: pip install --quiet -r mkdocs-requirements.txt
      # --strict turns a broken internal link or a missing page into a failure
      # instead of a silently published site.
      - name: Build site
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
