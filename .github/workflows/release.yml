name: release

on:
  push:
    tags:
      - "v*"

env:
  ENNOTE_NPM_PACKAGE: "@seqyuan/ennote"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-publish
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Read Package Version
        id: pkg
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Verify Tag Matches Version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${{ steps.pkg.outputs.version }}" >&2
            exit 1
          fi

      - name: Verify Tag Commit Is On main
        run: |
          git fetch origin main --force
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "tag ${GITHUB_REF_NAME} points to a commit outside origin/main" >&2
            exit 1
          fi

      - name: Check npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "missing repository secret NPM_TOKEN" >&2
            exit 1
          fi

      - name: Test
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run test:go

      - name: Build Frontend
        run: npm run build:web

      - name: Cross-Compile Go Binaries
        run: npm run release:build-worker

      - name: Verify Linux Binaries Are Statically Linked
        # Without CGO_ENABLED=0 the linux-x64 build links glibc dynamically
        # and fails on older distros (GLIBC_2.32/2.34 not found); pin the
        # property so this cannot regress silently.
        run: |
          cd worker
          for f in ennogate-linux-* ennoworker-linux-*; do
            if ldd "$f" >/dev/null 2>&1; then
              echo "$f is dynamically linked:" >&2
              ldd "$f" >&2
              exit 1
            fi
            echo "$f: statically linked"
          done

      - name: Verify Tarball
        run: npm run pack:check

      - name: Smoke Test Installed Package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ENNOTE_SMOKE_WORKER_DIR: ${{ github.workspace }}/worker
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm run smoke:installed

      - name: Publish To npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          if npm view "$ENNOTE_NPM_PACKAGE@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "Package $ENNOTE_NPM_PACKAGE@${{ steps.pkg.outputs.version }} already published, nothing to do."
          else
            npm publish --access public
          fi
          # Accounts with 2FA may leave the publish staged instead of live.
          # If the verification step below fails, approve the staged release
          # from a trusted machine (npm stage list && npm stage approve <id>),
          # then re-run this workflow. Do not re-run publish: npm rejects a
          # version that is already staged with E409.

      - name: Verify npm Version Is Live
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! npm view "$ENNOTE_NPM_PACKAGE@${{ steps.pkg.outputs.version }}" version; then
            echo "::error::npm publish did not make ${{ steps.pkg.outputs.version }} visible. The release is probably staged (2FA): run 'npm stage list' and 'npm stage approve <id>', then re-run this workflow."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            worker/ennogate-*
            worker/ennoworker-*
            worker/SHA256SUMS
          fail_on_unmatched_files: true
