name: release

on:
  push:
    tags:
      - "v*"

env:
  ENNOTE_NPM_PACKAGE: "@seqyuan/ennote"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-publish
    permissions:
      contents: write
      # Keyless Sigstore attestation: the release assets are signed with the
      # workflow identity, so a downloader can verify what produced them without
      # the project holding a signing key.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Read Package Version
        id: pkg
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Verify Tag Matches Version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${{ steps.pkg.outputs.version }}" >&2
            exit 1
          fi

      - name: Verify Tag Commit Is On main
        run: |
          git fetch origin main --force
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "tag ${GITHUB_REF_NAME} points to a commit outside origin/main" >&2
            exit 1
          fi

      - name: Check npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "missing repository secret NPM_TOKEN" >&2
            exit 1
          fi

      - name: Test
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run test:go
          npm run check:error-codes

      - name: Build Frontend
        run: npm run build:web

      - name: Cross-Compile Go Binaries
        run: npm run release:build-worker

      - name: Verify Linux Binaries Are Statically Linked
        # Without CGO_ENABLED=0 the linux-x64 build links glibc dynamically
        # and fails on older distros (GLIBC_2.32/2.34 not found); pin the
        # property so this cannot regress silently.
        run: |
          cd worker
          for f in ennogate-linux-* ennoworker-linux-*; do
            if ldd "$f" >/dev/null 2>&1; then
              echo "$f is dynamically linked:" >&2
              ldd "$f" >&2
              exit 1
            fi
            echo "$f: statically linked"
          done

      - name: Verify Tarball
        run: npm run pack:check

      - name: Smoke Test Installed Package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ENNOTE_SMOKE_WORKER_DIR: ${{ github.workspace }}/worker
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm run smoke:installed

      - name: Publish To npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          if npm view "$ENNOTE_NPM_PACKAGE@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "Package $ENNOTE_NPM_PACKAGE@${{ steps.pkg.outputs.version }} already published, nothing to do."
          else
            # --provenance has npm attach a Sigstore attestation linking this
            # tarball to the workflow run and commit that produced it.
            npm publish --access public --provenance
          fi
          # Accounts with 2FA may leave the publish staged instead of live.
          # If the verification step below fails, approve the staged release
          # from a trusted machine (npm stage list && npm stage approve <id>),
          # then re-run this workflow. Do not re-run publish: npm rejects a
          # version that is already staged with E409.

      - name: Verify npm Version Is Live
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # The registry accepts a publish into an asynchronous processing queue
          # ("your package is being processed and may take a few minutes") and the
          # version appears later — v0.6.0 took about two minutes. A single check
          # raced that window and failed a release whose publish had succeeded, so
          # poll instead of guessing.
          for attempt in $(seq 1 40); do
            if npm view "$ENNOTE_NPM_PACKAGE@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
              echo "$ENNOTE_NPM_PACKAGE@${{ steps.pkg.outputs.version }} is live"
              exit 0
            fi
            echo "not visible yet (attempt ${attempt}/40), waiting 15s"
            sleep 15
          done
          echo "::error::${{ steps.pkg.outputs.version }} is still not visible after 10 minutes."
          echo "If the publish is waiting for approval (2FA or staged publishing), run"
          echo "  npm stage list && npm stage approve <id>"
          echo "from a machine with the publisher's credentials, then re-run this job."
          npm view "$ENNOTE_NPM_PACKAGE@${{ steps.pkg.outputs.version }}" --json || true
          exit 1

      # Attestation is a public-repository feature: GitHub refuses to create one
      # for a workflow running in a private repository (unless the org is on
      # GHEC). This repository is private, so the binaries are attested where
      # they are published — `seqyuan/ennote-bin` — by the dispatch below. When
      # this repository becomes public the step runs here instead.
      - name: Attest Release Provenance (public source only)
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            worker/ennogate-*
            worker/ennoworker-*
            worker/SHA256SUMS

      # Kept as the private audit trail: the tag, the commit, and the bytes that
      # were produced for it, readable by the maintainer without a public repo.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            worker/ennogate-*
            worker/ennoworker-*
            worker/SHA256SUMS
          fail_on_unmatched_files: true

      # The binaries users actually run are published from the public repository:
      # a release asset in a private repository is authenticated, so `npx` cannot
      # fetch it on first run. `BIN_REPO_TOKEN` is a fine-grained PAT with
      # contents:write on seqyuan/ennote-bin; without it the mirror is skipped
      # with a warning rather than failing a release that is otherwise complete.
      - name: Mirror Binaries To The Public Repository
        env:
          GH_TOKEN: ${{ secrets.BIN_REPO_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::BIN_REPO_TOKEN is not set; the public mirror was skipped and users cannot download ${TAG}."
            exit 0
          fi
          if ! gh release view "$TAG" -R seqyuan/ennote-bin >/dev/null 2>&1; then
            gh release create "$TAG" -R seqyuan/ennote-bin \
              --title "$TAG" \
              --notes "Ennote runtime binaries for ${TAG} (source: seqyuan/ennote@${GITHUB_SHA})."
          fi
          gh release upload "$TAG" worker/ennogate-* worker/ennoworker-* worker/SHA256SUMS \
            -R seqyuan/ennote-bin --clobber
          # The public repository attests the assets it just received: an
          # attestation is only verifiable against the repository that produced
          # it, and that repository is now this one.
          gh api -X POST "repos/seqyuan/ennote-bin/dispatches" \
            -f event_type=ennote-release \
            -F "client_payload[tag]=${TAG}" \
            -F "client_payload[sha]=${GITHUB_SHA}"
