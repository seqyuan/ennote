name: npm-publish

on:
  push:
    tags:
      - "v*"

env:
  ENNOTE_NPM_PACKAGE: "@seqyuan/ennote"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-publish
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Read Package Version
        id: pkg
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Verify Tag Matches Version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${{ steps.pkg.outputs.version }}" >&2
            exit 1
          fi

      - name: Verify Tag Commit Is On main
        run: |
          git fetch origin main --force
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "tag ${GITHUB_REF_NAME} points to a commit outside origin/main" >&2
            exit 1
          fi

      - name: Check npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "missing repository secret NPM_TOKEN" >&2
            exit 1
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build Frontend
        run: npm run build:web

      - name: Cross-Compile Go Binaries
        run: npm run release:build-worker

      - name: Verify Tarball
        run: npm run pack:check

      - name: Smoke Test Installed Package
        run: npm run smoke:installed

      - name: Publish To npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          if npm view "$ENNOTE_NPM_PACKAGE@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "Package already published, setting access to public..."
            npm access set status=public "$ENNOTE_NPM_PACKAGE"
          else
            npm publish --access public
          fi
