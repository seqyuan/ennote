      properties:
        name: { type: string }
        path: { type: string, pattern: ^/workspace(?:/|$) }
        isDir: { type: boolean }
        size: { type: integer, format: int64, minimum: 0 }
        modifiedAt: { type: string, format: date-time }
    Session:
      type: object
      additionalProperties: false
      required: [id, projectId, title, status, mode, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        title: { type: string }
        status: { type: string, enum: [active, archived] }
        mode: { type: string, enum: [hosted, room] }
        activeLeafMessageId: { type: string }
        activeBranchId: { type: string }
        defaultAgentProfileId: { type: string }
        defaultModelProfileId: { type: string }
        compactionPolicyProfileId: { type: string }
        sourceSessionId: { type: string }
        sourceMessageId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SessionBranch:
      type: object
      required: [id, sessionId, label, messageCount, active, createdAt, updatedAt]
      properties:
        id: { type: string }
        sessionId: { type: string }
        parentBranchId: { type: string }
        forkMessageId: { type: string }
        leafMessageId: { type: string }
        label: { type: string }
        messageCount: { type: integer, minimum: 0 }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BranchNavigation:
      type: object
      required: [session, branches]
      properties:
