        icon: { type: string }
        color: { type: string }
        positioning: { type: string }
        configDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
    Message:
      type: object
      additionalProperties: false
      required: [id, sessionId, role, status, speakerKind, speakerSnapshot, visibility, parts, createdAt]
