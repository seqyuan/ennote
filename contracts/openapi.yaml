openapi: 3.1.0
info:
  title: Ennote ennoworker API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "0"
security:
  - bearerAuth: []
paths:
  /v1/health/live:
    get:
      security: []
      operationId: getLiveness
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
  /v1/health/ready:
    get:
      security: []
      operationId: getReadiness
      responses:
        "200":
          description: Worker is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "503":
          $ref: "#/components/responses/Error"
  /v1/runtime:
    get:
      operationId: getRuntimeInfo
      responses:
        "200":
          description: Current Worker process identity used as the connection generation
          headers:
            X-Ennote-Worker-Instance:
              description: Current Worker process identity
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/RuntimeInfo" } }
        "401": { $ref: "#/components/responses/Error" }
  /v1/roles:
    get:
      operationId: listRoles
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: scope, in: query, schema: { $ref: "#/components/schemas/RoleScope" } }
        - { name: projectId, in: query, schema: { type: string } }
        - { name: flowId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, archived], default: active } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Effective Role catalog without draft or prompt bodies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/RoleCatalogPage" } }
    post:
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoleInput" }
      responses:
        "201":
          description: Role draft created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/RoleIdentity" } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/roles/{roleID}:
    parameters:
      - { name: roleID, in: path, required: true, schema: { type: string } }
    get:
      operationId: getRole
      responses:
        "200":
          description: Role authoring detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/RoleIdentity" } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/roles/{roleID}/draft:
    parameters:
      - { name: roleID, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateRoleDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRoleDraftInput" }
      responses:
        "200":
          description: Updated Role draft
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/RoleIdentity" } }
        "409": { $ref: "#/components/responses/Error" }
  /v1/roles/{roleID}/validate:
    parameters:
      - { name: roleID, in: path, required: true, schema: { type: string } }
    post:
      operationId: validateRole
      responses:
        "200":
          description: Role draft validation diagnostics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/RoleValidationResult" } }
  /v1/roles/{roleID}/publish:
    parameters:
      - { name: roleID, in: path, required: true, schema: { type: string } }
    post:
      operationId: publishRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision]
              properties: { expectedRevision: { type: integer, minimum: 0 } }
      responses:
        "201":
          description: Immutable Role version published
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/RoleVersion" } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/roles/{roleID}/archive:
    parameters:
      - { name: roleID, in: path, required: true, schema: { type: string } }
    post:
      operationId: archiveRole
      responses:
        "200":
          description: Archived Role identity
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/RoleIdentity" } }
  /v1/roles/{roleID}/versions:
    parameters:
      - { name: roleID, in: path, required: true, schema: { type: string } }
    get:
      operationId: listRoleVersions
      responses:
        "200":
          description: Immutable Role version history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/RoleVersion" } }
  /v1/roles/{roleID}/versions/{versionID}:
    parameters:
      - { name: roleID, in: path, required: true, schema: { type: string } }
      - { name: versionID, in: path, required: true, schema: { type: string } }
    get:
      operationId: getRoleVersion
      responses:
        "200":
          description: Exact immutable Role version
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/RoleVersion" } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectID}/roles/candidates:
    parameters:
      - { name: projectID, in: path, required: true, schema: { type: string } }
    get:
      operationId: listProjectRoleCandidates
      summary: Discover .ennote/roles/*.md candidates without publishing them
      responses:
        "200":
          description: Parse-only project Role candidates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/RoleCandidate" } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectID}/roles/from-candidate:
    parameters:
      - { name: projectID, in: path, required: true, schema: { type: string } }
    post:
      operationId: materializeProjectRoleCandidate
      summary: Explicitly publish a server-resolved project Role candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [handle]
              properties:
                handle: { type: string, pattern: "^[a-z][a-z0-9_-]{1,31}$" }
      responses:
        "200":
          description: Existing identical immutable version reused
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/MaterializedRoleCandidate" } }
        "201":
          description: Candidate materialized or updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/MaterializedRoleCandidate" } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/global-roles:
    get:
      operationId: listGlobalRoles
      summary: List Worker-global file-authored Roles
      responses:
        "200":
          description: Global Role source summaries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { type: array, items: { $ref: "#/components/schemas/GlobalRoleSummary" } } }
    post:
      operationId: createGlobalRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [document]
              properties: { document: { $ref: "#/components/schemas/PortableRoleDocument" } }
      responses:
        "201":
          description: Global Role source created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/GlobalRoleDetail" } }
        "422": { $ref: "#/components/responses/Error" }
  /v1/global-roles/{roleID}:
    parameters:
      - { name: roleID, in: path, required: true, schema: { type: string } }
    get:
      operationId: getGlobalRole
      responses:
        "200":
          description: Global Role source
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/GlobalRoleDetail" } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateGlobalRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedDigest, document]
              properties:
                expectedDigest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                document: { $ref: "#/components/schemas/PortableRoleDocument" }
      responses:
        "200":
          description: Updated global Role source
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/GlobalRoleDetail" } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/graphs:
    get:
      operationId: listGraphs
      summary: List Worker-global Graph source summaries without loading private resources
      responses:
        "200":
          description: Global Graph catalog
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { type: array, items: { $ref: "#/components/schemas/GraphSummary" } } }
    post:
      operationId: createGraph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id: { type: string, pattern: "^[a-z][a-z0-9-]{1,63}$" }
                name: { type: string, minLength: 1 }
      responses:
        "201":
          description: Empty editable Graph draft created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/GraphDetail" } }
        "422": { $ref: "#/components/responses/Error" }
  /v1/graphs/{graphID}:
    parameters:
      - { name: graphID, in: path, required: true, schema: { type: string } }
    get:
      operationId: getGraph
      responses:
        "200":
          description: Parsed Graph draft
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/GraphDetail" } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateGraph
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GraphMutation" }
      responses:
        "200":
          description: Semantically updated Graph draft
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/GraphDetail" } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/global-roles/{roleID}/publish:
    parameters:
      - { name: roleID, in: path, required: true, schema: { type: string } }
    post:
      operationId: publishGlobalRole
      responses:
        "201":
          description: Global Role source published as an immutable runtime version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/global-roles/{roleID}/versions:
    parameters:
      - { name: roleID, in: path, required: true, schema: { type: string } }
    get:
      operationId: listGlobalRoleRevisions
      responses:
        "200":
          description: Immutable file-backed Role revisions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ImmutableFileRevision" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/global-roles/{roleID}/resolved:
    parameters:
      - { name: roleID, in: path, required: true, schema: { type: string } }
    get:
      operationId: getResolvedGlobalRole
      summary: Resolve a bare Role handle to its latest published revision with audit source
      responses:
        "200":
          description: Resolved effective Role
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/ResolvedGlobalRole" } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/graphs/{graphID}/publish:
    parameters:
      - { name: graphID, in: path, required: true, schema: { type: string } }
    post:
      operationId: publishGraph
      responses:
        "201":
          description: Immutable Graph version published
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/AgentFlowVersion" } }
        "422": { $ref: "#/components/responses/Error" }
  /v1/graphs/{graphID}/versions:
    parameters:
      - { name: graphID, in: path, required: true, schema: { type: string } }
    get:
      operationId: listGraphVersions
      responses:
        "200":
          description: Immutable Graph versions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { type: array, items: { $ref: "#/components/schemas/AgentFlowVersion" } } }
  /v1/graphs/{graphID}/runs:
    parameters:
      - { name: graphID, in: path, required: true, schema: { type: string } }
    post:
      operationId: runGraph
      summary: Run a global published Graph in a Session-derived Project workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sessionId]
              properties:
                sessionId: { type: string }
                version: { type: integer, minimum: 1 }
                inputs: { type: object, additionalProperties: true }
                vars: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Durable Graph Run created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/RunAgentFlow" } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/graph-runs:
    parameters:
      - { name: sessionID, in: path, required: true, schema: { type: string } }
    get:
      operationId: listSessionGraphRuns
      summary: List the Session's Graph Runs, newest first
      responses:
        "200":
          description: Session Graph Runs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { type: array, items: { $ref: "#/components/schemas/RunAgentFlow" } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/graph-runs/{runID}:
    parameters:
      - { name: sessionID, in: path, required: true, schema: { type: string } }
      - { name: runID, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSessionGraphRun
      summary: One Graph Run with task checkpoints and the frozen flow version
      responses:
        "200":
          description: Graph Run detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [run, nodes]
                        properties:
                          run: { $ref: "#/components/schemas/RunAgentFlow" }
                          nodes:
                            type: array
                            items: { $ref: "#/components/schemas/RunAgentFlowNode" }
                          flowVersion: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: cancelSessionGraphRun
      summary: Cancel a running Graph Run
      responses:
        "200":
          description: The (possibly now terminal) Graph Run
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/RunAgentFlow" } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/graph-runs/{runID}/resume:
    parameters:
      - { name: sessionID, in: path, required: true, schema: { type: string } }
      - { name: runID, in: path, required: true, schema: { type: string } }
    post:
      operationId: resumeSessionGraphRun
      summary: Resume a cancelled or failed Graph Run
      responses:
        "200":
          description: The reset Graph Run (pending)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/RunAgentFlow" } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/graphs/{graphID}/builder:
    parameters:
      - { name: graphID, in: path, required: true, schema: { type: string } }
    get:
      operationId: getGraphBuilderThread
      responses:
        "200":
          description: Persistent Builder thread and pending proposal
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/GraphBuilderThread" } }
  /v1/graphs/{graphID}/builder/messages:
    parameters:
      - { name: graphID, in: path, required: true, schema: { type: string } }
    post:
      operationId: sendGraphBuilderMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [modelProfileId, instruction]
              properties:
                modelProfileId: { type: string }
                instruction: { type: string, minLength: 1, maxLength: 65536 }
      responses:
        "201":
          description: Builder response and validated proposal
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/GraphBuilderThread" } }
        "422": { $ref: "#/components/responses/Error" }
  /v1/graphs/{graphID}/builder/proposals/{proposalID}/apply:
    parameters:
      - { name: graphID, in: path, required: true, schema: { type: string } }
      - { name: proposalID, in: path, required: true, schema: { type: string } }
    post:
      operationId: applyGraphBuilderProposal
      responses:
        "200":
          description: Proposal applied atomically to graph.yaml
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/GraphDetail" } }
        "409": { $ref: "#/components/responses/Error" }
  /v1/provider-profiles:
    get:
      operationId: listProviderProfiles
      responses:
        "200":
          description: Provider profiles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ProviderProfile" }
    post:
      operationId: createProviderProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, providerType, baseUrl]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1 }
                providerType: { type: string, enum: [openai-compatible, anthropic] }
                baseUrl: { type: string, format: uri }
                apiKey: { type: string }
                proxy: { type: string }
      responses:
        "201":
          description: Provider profile created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderProfile" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/provider-profiles/discover-models:
    post:
      operationId: discoverProviderModels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                providerId: { type: string }
                baseUrl: { type: string, format: uri }
                apiKey: { type: string }
      responses:
        "200":
          description: Fetched model catalog
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/DiscoveredModel" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/provider-profiles/{providerID}:
    parameters:
      - name: providerID
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteProviderProfile
      responses:
        "204":
          description: Provider and its models removed
        "400": { $ref: "#/components/responses/Error" }
  /v1/provider-profiles/{providerID}/test:
    parameters:
      - name: providerID
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: testProviderProfile
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                modelProfileId: { type: string }
      responses:
        "200":
          description: Ephemeral Provider diagnostic result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderDiagnostic" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/model-profiles:
    get:
      operationId: listModelProfiles
      responses:
        "200":
          description: Model profiles, with the explicit global default first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ModelProfile" }
    post:
      operationId: createModelProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId, modelName, contextWindow, maxOutputTokens]
              additionalProperties: false
              properties:
                providerId: { type: string }
                modelName: { type: string, minLength: 1 }
                displayName: { type: string }
                contextWindow: { type: integer, minimum: 1 }
                maxOutputTokens: { type: integer, minimum: 1 }
                inputCostUsdMicrosPerMillion: { type: integer, minimum: 0, maximum: 1000000000, default: 0 }
                outputCostUsdMicrosPerMillion: { type: integer, minimum: 0, maximum: 1000000000, default: 0 }
                supportsVision: { type: boolean }
                supportsToolUse: { type: boolean }
                supportsThinking: { type: boolean }
                thinkingDialect: { $ref: "#/components/schemas/ThinkingDialect" }
                supportedThinkingEfforts:
                  type: array
                  uniqueItems: true
                  items: { $ref: "#/components/schemas/ThinkingEffort" }
                isDefault: { type: boolean }
      responses:
        "201":
          description: Model profile created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ModelProfile" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/model-profiles/{modelID}:
    parameters:
      - name: modelID
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteModelProfile
      responses:
        "204":
          description: Model profile removed
        "400": { $ref: "#/components/responses/Error" }
  /v1/model-profiles/{modelID}/default:
    parameters:
      - name: modelID
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: setDefaultModelProfile
      responses:
        "200":
          description: Explicit global default model profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ModelProfile" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/policy-profiles:
    get:
      operationId: listPolicyProfiles
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [tool, turn, vision, compaction] }
      responses:
        "200":
          description: Versioned policy profiles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PolicyProfile" }
    post:
      operationId: createPolicyProfileVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, config]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1 }
                kind: { type: string, enum: [tool, turn, vision, compaction] }
                config: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Policy profile version created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PolicyProfile" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/policy-profiles/{policyID}/default:
    parameters:
      - name: policyID
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: setDefaultPolicyProfile
      responses:
        "200":
          description: Global default policy for its kind
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PolicyProfile" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/policy-profiles/{policyID}:
    parameters:
      - name: policyID
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deactivatePolicyProfile
      responses:
        "204": { description: Policy profile deactivated }
        "404": { $ref: "#/components/responses/Error" }
  /v1/projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, hostPath]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1 }
                description: { type: string }
                hostPath: { type: string, minLength: 1 }
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [project, workspace]
                        properties:
                          project: { $ref: "#/components/schemas/Project" }
                          workspace: { $ref: "#/components/schemas/ProjectWorkspace" }
        "400":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectID}/workspace:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: getProjectWorkspace
      responses:
        "200":
          description: Active project workspace
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProjectWorkspace" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectID}/files:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: listProjectFiles
      parameters:
        - name: path
          in: query
          description: Project-relative virtual path rooted at /workspace
          schema: { type: string, default: /workspace }
      responses:
        "200":
          description: Directory entries, with directories first and names sorted case-insensitively
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/WorkspaceFileEntry" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectID}/files/content:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: readProjectFile
      parameters:
        - name: path
          in: query
          required: true
          description: Project-relative virtual file path rooted at /workspace
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: File bytes with detected MIME type and Range support
          headers:
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
            Cache-Control:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: Requested byte range
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /v1/mcp/server-profiles:
    get:
      operationId: listMCPServerProfiles
      summary: List MCP server profiles (managed + the current project's own project-file profiles)
      parameters:
        - name: projectId
          in: query
          required: false
          description: When set, project-file profiles scoped to other projects are filtered out
          schema: { type: string }
      responses:
        "200":
          description: MCP server profiles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/MCPServerProfile" }
    post:
      operationId: createMCPServerProfile
      summary: Create a managed MCP server profile (project_file/bundled are never creatable via the API)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, slug]
              properties:
                displayName: { type: string }
                slug: { type: string }
                sourceKind: { type: string, enum: [managed], default: managed }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MCPServerProfile" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/mcp/server-profiles/{profileID}:
    parameters:
      - $ref: "#/components/parameters/ProfileID"
    delete:
      operationId: deleteMCPServerProfile
      summary: Archive an MCP server profile
      responses:
        "204": { description: Archived }
        "404": { $ref: "#/components/responses/Error" }
  /v1/mcp/server-profiles/{profileID}/versions:
    parameters:
      - $ref: "#/components/parameters/ProfileID"
    get:
      operationId: listMCPProfileVersions
      summary: List immutable versions of an MCP profile
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/MCPServerProfileVersion" }
    post:
      operationId: createMCPServerVersion
      summary: Create an immutable version of an MCP profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPServerProfileVersion" }
      responses:
        "201": { description: Created }
        "400": { $ref: "#/components/responses/Error" }
  /v1/mcp/bundled-catalog:
    get:
      operationId: listMCPBundledCatalog
      summary: List embedded bundled MCP descriptors (static, no execution)
      responses:
        "200":
          description: Bundled catalog
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/BundledDescriptor" }
  /v1/projects/{projectID}/mcp/bindings:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: listMCPBindings
      summary: List MCP bindings for a project
      responses:
        "200":
          description: Bindings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/MCPProjectBinding" }
    post:
      operationId: createMCPBinding
      summary: Create or update an MCP binding for a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profileVersionId]
              properties:
                profileVersionId: { type: string }
                desiredEnabled: { type: boolean, default: false }
                required: { type: boolean, default: true }
                selectedRemoteToolNames:
                  type: array
                  items: { type: string }
                credentialRefs:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MCPProjectBinding" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectID}/mcp/candidates:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: listMCPCandidates
      summary: List discovered MCP candidates (bundled, managed, project file) without executing them
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/MCPCandidate" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectID}/mcp/discovery/refresh:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      operationId: refreshMCPDiscovery
      summary: Re-scan project file and bundled descriptors
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/MCPCandidate" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectID}/mcp/bindings/from-candidate:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      operationId: createMCPBindingFromCandidate
      summary: Materialize a discovered candidate into an immutable version and bind it (never auto-enabled)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, transport]
              properties:
                slug: { type: string }
                sourceKind: { type: string }
                executable: { type: string }
                endpoint: { type: string }
                transport: { type: string }
                configDigest: { type: string }
      responses:
        "201":
          description: Created (disabled binding)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MCPProjectBinding" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectID}/mcp/bindings/{bindingID}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/BindingID"
    patch:
      operationId: updateMCPBinding
      summary: Update an MCP binding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                desiredEnabled: { type: boolean }
                required: { type: boolean }
                selectedRemoteToolNames:
                  type: array
                  items: { type: string }
                credentialRefs:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "200": { description: Updated }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMCPBinding
      summary: Delete an MCP binding
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectID}/mcp/bindings/{bindingID}/test:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/BindingID"
    post:
      operationId: testMCPBinding
      summary: Test a browse connection to the bound MCP server
      responses:
        "200":
          description: Connection succeeded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ok: { type: boolean }
                          transport: { type: string }
        "502": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectID}/mcp/bindings/{bindingID}/catalog:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/BindingID"
    get:
      operationId: getMCPBindingCatalog
      summary: Get the normalized tool catalog for a binding (cached)
      responses:
        "200":
          description: Normalized catalog entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/MCPCatalogEntry" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectID}/mcp/bindings/{bindingID}/catalog/refresh:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/BindingID"
    post:
      operationId: refreshMCPBindingCatalog
      summary: Force a catalog refresh via a browse connection
      responses:
        "200":
          description: Fresh catalog entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/MCPCatalogEntry" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectID}/sessions:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: listSessions
      parameters:
        - name: status
          in: query
          description: Session lifecycle view; defaults to active
          schema: { type: string, enum: [active, archived], default: active }
        - name: q
          in: query
          description: Case-insensitive literal title substring within the selected Project
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Sessions in the requested lifecycle state, ordered by recent update
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string }
                defaultModelProfileId: { type: string }
                compactionPolicyProfileId: { type: string }
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Session" }
        "400":
          $ref: "#/components/responses/Error"
  /v1/sessions/{sessionID}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      operationId: getSession
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Session" }
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                defaultModelProfileId:
                  oneOf:
                    - { type: string }
                    - { type: "null" }
                compactionPolicyProfileId:
                  oneOf:
                    - { type: string }
                    - { type: "null" }
      responses:
        "200":
          description: Session defaults updated; already frozen runs are unaffected
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/archive:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      operationId: archiveSession
      responses:
        "200":
          description: Active Session archived without changing canonical history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/restore:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      operationId: restoreSession
      responses:
        "200":
          description: Archived Session restored as active
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      operationId: listSessionMessages
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before
          in: query
          description: Opaque cursor returned by the previous page; bound to the current Session and active branch
          schema: { type: string }
      responses:
        "200":
          description: Canonical messages from the active Session branch, ordered oldest to newest within the page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SessionMessagePage" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/events:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      operationId: streamSessionEvents
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Session change feed (durable event whitelist + transient snapshots)
          content:
            text/event-stream:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/artifacts/{artifactID}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - name: artifactID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getArtifact
      responses:
        "200":
          description: Session-authorized immutable artifact metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Artifact" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/artifacts/{artifactID}/preview:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - name: artifactID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: previewArtifact
      parameters:
        - name: sheet
          in: query
          description: Exact XLSX worksheet name; ignored for other artifact kinds
          schema: { type: string }
      responses:
        "200":
          description: Safe preview selected by the stored artifact kind
          headers:
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/TablePreview"
                          - $ref: "#/components/schemas/TextPreview"
            text/html:
              schema: { type: string }
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/artifacts/{artifactID}/download:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - name: artifactID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: downloadArtifact
      responses:
        "200":
          description: Original immutable artifact bytes served as an attachment
          headers:
            Content-Disposition:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
