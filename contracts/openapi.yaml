        existing: { type: boolean }
    ContextCompaction:
      type: object
      required: [id, sessionId, status, reason, requestedConfig, effectiveConfig, baseLeafMessageId,
        firstKeptMessageId, sourceDigest, summaryContractDigest, summary, summaryDigest, promptVersion,
        tokensBefore, estimatedTokensAfter, reclaimedTokens, createdAt]
      properties:
        id: { type: string }
        runId: { type: string }
        sessionId: { type: string }
        clientRequestId: { type: string }
        status: { type: string, enum: [planned, running, completed, failed, cancelled] }
        reason: { type: string, enum: [manual, threshold, overflow] }
        policyProfileId: { type: string }
        policyVersion: { type: integer }
        requestedConfig: { type: object, additionalProperties: true }
        effectiveConfig: { type: object, additionalProperties: true }
        baseLeafMessageId: { type: string }
        previousCompactionId: { type: string }
        sourceFromMessageId: { type: string }
        sourceThroughMessageId: { type: string }
        firstKeptMessageId: { type: string }
        sourceDigest: { type: string }
        summaryContractDigest: { type: string }
        summary: { type: string }
        summaryDigest: { type: string }
        promptVersion: { type: string }
        modelCallId: { type: string }
        tokensBefore: { type: integer }
        estimatedTokensAfter: { type: integer }
        reclaimedTokens: { type: integer }
        errorCode: { type: string }
        errorMessage: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    QueuedInput:
      type: object
      required: [id, runId, sessionId, clientRequestId, seq, kind, text, status, createdAt]
      properties:
        id: { type: string }
        runId: { type: string }
        sessionId: { type: string }
        clientRequestId: { type: string }
        seq: { type: integer, format: int64 }
        kind: { type: string, enum: [steer, follow_up] }
        text: { type: string }
        status: { type: string, enum: [queued, injected, cancelled] }
        createdAt: { type: string, format: date-time }
        injectedAt: { type: string, format: date-time }
    # ——— Prompt Templates ———
    PromptTemplateSummary:
      type: object
      required: [name, description, argumentHint, source, editable]
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
        argumentHint: { type: string }
        source: { type: string, enum: [builtin, settings, global, project] }
        editable: { type: boolean }
    PromptTemplateDiagnostic:
      type: object
      additionalProperties: false
      properties:
        level: { type: string, enum: [info, warning] }
        code: { type: string }
        source: { type: string }
        path: { type: string }
        name: { type: string }
        message: { type: string }
    GlobalPromptTemplateEntry:
      type: object
      required: [name, valid, editable]
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
        argumentHint: { type: string }
        valid: { type: boolean }
        editable: { type: boolean }
        diagnostic: { $ref: '#/components/schemas/PromptTemplateDiagnostic' }
    ExpandPromptTemplateInput:
      type: object
      required: [invocation]
      additionalProperties: false
      properties:
        invocation: { type: string }
    ExpandPromptTemplateMatched:
      type: object
      required: [case, name, text, diagnostics]
      additionalProperties: false
      properties:
        case: { type: string, const: matched }
        name: { type: string }
        text: { type: string }
        diagnostics: { type: array, items: { $ref: '#/components/schemas/PromptTemplateDiagnostic' } }
    ExpandPromptTemplateNotFound:
      type: object
      required: [case, name, diagnostics]
      additionalProperties: false
      properties:
        case: { type: string, const: not_found }
        name: { type: string }
        diagnostics: { type: array, items: { $ref: '#/components/schemas/PromptTemplateDiagnostic' } }
    ExpandPromptTemplateInvalid:
      type: object
      required: [case, diagnostics]
      additionalProperties: false
      properties:
        case: { type: string, const: invalid_invocation }
        diagnostics: { type: array, items: { $ref: '#/components/schemas/PromptTemplateDiagnostic' }, maxItems: 0 }
    ExpandPromptTemplateResult:
      oneOf:
        - { $ref: '#/components/schemas/ExpandPromptTemplateMatched' }
        - { $ref: '#/components/schemas/ExpandPromptTemplateNotFound' }
        - { $ref: '#/components/schemas/ExpandPromptTemplateInvalid' }
    CreatePromptTemplateInput:
      type: object
      required: [name, body]
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
        argumentHint: { type: string }
        body: { type: string }
    UpdatePromptTemplateInput:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        description: { type: string }
        argumentHint: { type: string }
        body: { type: string }
    PromptTemplateCatalog:
      type: object
      required: [templates, diagnostics]
      additionalProperties: false
      properties:
        templates: { type: array, items: { $ref: '#/components/schemas/PromptTemplateSummary' } }
        diagnostics: { type: array, items: { $ref: '#/components/schemas/PromptTemplateDiagnostic' } }
    PromptTemplateManagementCatalog:
      type: object
      required: [templates, globalTemplates, globalRecoveryMode, diagnostics]
      additionalProperties: false
      properties:
        templates: { type: array, items: { $ref: '#/components/schemas/PromptTemplateSummary' } }
        globalTemplates: { type: array, items: { $ref: '#/components/schemas/GlobalPromptTemplateEntry' } }
        globalRecoveryMode: { type: boolean }
        diagnostics: { type: array, items: { $ref: '#/components/schemas/PromptTemplateDiagnostic' } }

  /v1/delegation-items/{itemID}/{command}:
    parameters:
      - name: itemID
        in: path
        required: true
        schema: { type: string }
      - name: command
        in: path
        required: true
        schema: { type: string, enum: [input, follow-up] }
    post:
      operationId: continueDelegationItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DelegationInputCommand" }
      responses:
        "200":
          description: New continuation generation and child Run
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    additionalProperties: false
                    required: [generation]
                    properties:
                      generation: { $ref: "#/components/schemas/DelegationGeneration" }
                      childRunId: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/attention:
    get:
      operationId: listAttention
      parameters:
        - name: projectId
          in: query
          schema: { type: string }
        - name: sessionId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [pending, resolved, dismissed] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Pending-first attention items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AttentionPage" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/attention:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      operationId: listSessionAttention
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, resolved, dismissed] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Attention items for one session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AttentionPage" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/attention/{attentionID}/dismiss:
    parameters:
      - name: attentionID
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: dismissAttention
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientRequestId]
              properties:
                clientRequestId: { type: string }
      responses:
        "200":
          description: Notification dismissed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { type: object, properties: { status: { type: string } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
