              properties:
                fromMessageId: { type: string, minLength: 1 }
                label: { type: string, maxLength: 120 }
      responses:
        "201":
          description: Branch created from the active lineage and activated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/BranchNavigation" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/branches/{branchID}/activate:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - name: branchID
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: activateSessionBranch
      responses:
        "200":
          description: Existing branch activated without rewriting messages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/BranchNavigation" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/recovery:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      operationId: getSessionRecovery
      responses:
        "200":
          description: Latest active-lineage failed or interrupted Run recovery state, or null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/RunRecovery"
                          - type: "null"
        "404": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/active-run:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      operationId: getSessionActiveRun
      responses:
        "200":
          description: Current non-terminal Run and its pending approval, or null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/ActiveRunState"
                          - type: "null"
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
