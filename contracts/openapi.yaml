      type: object
      required: [type, text]
      additionalProperties: false
      properties:
        type: { type: string, const: text }
        text: { type: string }
    ThinkingContentBlock:
      type: object
      required: [type, text]
      additionalProperties: false
      properties:
        type: { type: string, const: thinking }
        text: { type: string }
    ToolCallContentBlock:
      type: object
      required: [type, toolCall]
      additionalProperties: false
      properties:
        type: { type: string, const: tool_call }
