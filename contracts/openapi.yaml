openapi: 3.1.0
info:
  title: Ennote ennoworker API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "0"
security:
  - bearerAuth: []
paths:
  /v1/health/live:
    get:
      security: []
      operationId: getLiveness
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
  /v1/health/ready:
    get:
      security: []
      operationId: getReadiness
      responses:
        "200":
          description: Worker is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "503":
          $ref: "#/components/responses/Error"
  /v1/roles:
    get:
      operationId: listRoles
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: scope, in: query, schema: { $ref: "#/components/schemas/RoleScope" } }
        - { name: projectId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, archived], default: active } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Effective Role catalog without draft or prompt bodies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/RoleCatalogPage" } }
    post:
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoleInput" }
      responses:
        "201":
          description: Role draft created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/RoleIdentity" } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/roles/{roleID}:
    parameters:
      - { name: roleID, in: path, required: true, schema: { type: string } }
    get:
      operationId: getRole
      responses:
        "200":
          description: Role authoring detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/RoleIdentity" } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/roles/{roleID}/draft:
    parameters:
      - { name: roleID, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateRoleDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRoleDraftInput" }
      responses:
        "200":
          description: Updated Role draft
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/RoleIdentity" } }
        "409": { $ref: "#/components/responses/Error" }
  /v1/roles/{roleID}/validate:
    parameters:
      - { name: roleID, in: path, required: true, schema: { type: string } }
    post:
      operationId: validateRole
      responses:
        "200":
          description: Role draft validation diagnostics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/RoleValidationResult" } }
  /v1/roles/{roleID}/publish:
    parameters:
      - { name: roleID, in: path, required: true, schema: { type: string } }
    post:
      operationId: publishRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision]
              properties: { expectedRevision: { type: integer, minimum: 0 } }
      responses:
        "201":
          description: Immutable Role version published
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/RoleVersion" } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/roles/{roleID}/archive:
    parameters:
      - { name: roleID, in: path, required: true, schema: { type: string } }
    post:
      operationId: archiveRole
      responses:
        "200":
          description: Archived Role identity
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/RoleIdentity" } }
  /v1/roles/{roleID}/versions:
    parameters:
      - { name: roleID, in: path, required: true, schema: { type: string } }
    get:
      operationId: listRoleVersions
      responses:
        "200":
          description: Immutable Role version history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/RoleVersion" } }
  /v1/roles/{roleID}/versions/{versionID}:
    parameters:
      - { name: roleID, in: path, required: true, schema: { type: string } }
      - { name: versionID, in: path, required: true, schema: { type: string } }
    get:
      operationId: getRoleVersion
      responses:
        "200":
          description: Exact immutable Role version
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/RoleVersion" } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/provider-profiles:
    get:
      operationId: listProviderProfiles
      responses:
        "200":
          description: Provider profiles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ProviderProfile" }
    post:
      operationId: createProviderProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, providerType, baseUrl, credentialRef]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1 }
                providerType: { type: string, enum: [openai-compatible] }
                baseUrl: { type: string, format: uri }
                credentialRef: { type: string, pattern: "^(env|file|keyring):" }
                proxy: { type: string }
      responses:
        "201":
          description: Provider profile created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderProfile" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/provider-profiles/{providerID}/test:
    parameters:
      - name: providerID
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: testProviderProfile
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                modelProfileId: { type: string }
      responses:
        "200":
          description: Ephemeral Provider diagnostic result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderDiagnostic" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/model-profiles:
    get:
      operationId: listModelProfiles
      responses:
        "200":
          description: Model profiles, with the explicit global default first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ModelProfile" }
    post:
      operationId: createModelProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId, modelName, contextWindow, maxOutputTokens]
              additionalProperties: false
              properties:
                providerId: { type: string }
                modelName: { type: string, minLength: 1 }
                displayName: { type: string }
                contextWindow: { type: integer, minimum: 1 }
                maxOutputTokens: { type: integer, minimum: 1 }
                inputCostUsdMicrosPerMillion: { type: integer, minimum: 0, maximum: 1000000000, default: 0 }
                outputCostUsdMicrosPerMillion: { type: integer, minimum: 0, maximum: 1000000000, default: 0 }
                supportsVision: { type: boolean }
                supportsToolUse: { type: boolean }
                supportsThinking: { type: boolean }
                thinkingDialect: { $ref: "#/components/schemas/ThinkingDialect" }
                supportedThinkingEfforts:
                  type: array
                  uniqueItems: true
                  items: { $ref: "#/components/schemas/ThinkingEffort" }
                isDefault: { type: boolean }
      responses:
        "201":
          description: Model profile created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ModelProfile" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/model-profiles/{modelID}/default:
    parameters:
      - name: modelID
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: setDefaultModelProfile
      responses:
        "200":
          description: Explicit global default model profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ModelProfile" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/policy-profiles:
    get:
      operationId: listPolicyProfiles
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [tool, turn, vision, compaction] }
      responses:
        "200":
          description: Versioned policy profiles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PolicyProfile" }
    post:
      operationId: createPolicyProfileVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, config]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1 }
                kind: { type: string, enum: [tool, turn, vision, compaction] }
                config: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Policy profile version created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PolicyProfile" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/policy-profiles/{policyID}/default:
    parameters:
      - name: policyID
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: setDefaultPolicyProfile
      responses:
        "200":
          description: Global default policy for its kind
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PolicyProfile" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/policy-profiles/{policyID}:
    parameters:
      - name: policyID
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deactivatePolicyProfile
      responses:
        "204": { description: Policy profile deactivated }
        "404": { $ref: "#/components/responses/Error" }
  /v1/projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, hostPath]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1 }
                description: { type: string }
                hostPath: { type: string, minLength: 1 }
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [project, workspace]
                        properties:
                          project: { $ref: "#/components/schemas/Project" }
                          workspace: { $ref: "#/components/schemas/ProjectWorkspace" }
        "400":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectID}/workspace:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: getProjectWorkspace
      responses:
        "200":
          description: Active project workspace
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProjectWorkspace" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectID}/files:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: listProjectFiles
      parameters:
        - name: path
          in: query
          description: Project-relative virtual path rooted at /workspace
          schema: { type: string, default: /workspace }
      responses:
        "200":
          description: Directory entries, with directories first and names sorted case-insensitively
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/WorkspaceFileEntry" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectID}/files/content:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: readProjectFile
      parameters:
        - name: path
          in: query
          required: true
          description: Project-relative virtual file path rooted at /workspace
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: File bytes with detected MIME type and Range support
          headers:
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
            Cache-Control:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: Requested byte range
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectID}/sessions:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: listSessions
      parameters:
        - name: status
          in: query
          description: Session lifecycle view; defaults to active
          schema: { type: string, enum: [active, archived], default: active }
        - name: q
          in: query
          description: Case-insensitive literal title substring within the selected Project
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Sessions in the requested lifecycle state, ordered by recent update
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string }
                defaultModelProfileId: { type: string }
                compactionPolicyProfileId: { type: string }
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Session" }
        "400":
          $ref: "#/components/responses/Error"
  /v1/sessions/{sessionID}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      operationId: getSession
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Session" }
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                defaultModelProfileId:
                  oneOf:
                    - { type: string }
                    - { type: "null" }
                compactionPolicyProfileId:
                  oneOf:
                    - { type: string }
                    - { type: "null" }
      responses:
        "200":
          description: Session defaults updated; already frozen runs are unaffected
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/archive:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      operationId: archiveSession
      responses:
        "200":
          description: Active Session archived without changing canonical history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/restore:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      operationId: restoreSession
      responses:
        "200":
          description: Archived Session restored as active
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      operationId: listSessionMessages
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before
          in: query
          description: Opaque cursor returned by the previous page; bound to the current Session and active branch
          schema: { type: string }
      responses:
        "200":
          description: Canonical messages from the active Session branch, ordered oldest to newest within the page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SessionMessagePage" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/artifacts/{artifactID}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - name: artifactID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getArtifact
      responses:
        "200":
          description: Session-authorized immutable artifact metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Artifact" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/artifacts/{artifactID}/preview:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - name: artifactID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: previewArtifact
      parameters:
        - name: sheet
          in: query
          description: Exact XLSX worksheet name; ignored for other artifact kinds
          schema: { type: string }
      responses:
        "200":
          description: Safe preview selected by the stored artifact kind
          headers:
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/TablePreview"
                          - $ref: "#/components/schemas/TextPreview"
            text/html:
              schema: { type: string }
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/artifacts/{artifactID}/download:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - name: artifactID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: downloadArtifact
      responses:
        "200":
          description: Original immutable artifact bytes served as an attachment
          headers:
            Content-Disposition:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/branches:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      operationId: listSessionBranches
      responses:
        "200":
          description: Stable branch identities for this Session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/SessionBranch" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSessionBranch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromMessageId]
              additionalProperties: false
              properties:
                fromMessageId: { type: string, minLength: 1 }
                label: { type: string, maxLength: 120 }
      responses:
        "201":
          description: Branch created from the active lineage and activated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/BranchNavigation" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/branches/{branchID}/activate:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - name: branchID
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: activateSessionBranch
      responses:
        "200":
          description: Existing branch activated without rewriting messages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/BranchNavigation" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/recovery:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      operationId: getSessionRecovery
      responses:
        "200":
          description: Latest active-lineage failed or interrupted Run recovery state, or null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/RunRecovery"
                          - type: "null"
        "404": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/active-run:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      operationId: getSessionActiveRun
      responses:
        "200":
          description: Current non-terminal Run and its pending approval, or null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/ActiveRunState"
                          - type: "null"
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectID}/attachments/images:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      operationId: uploadImageAttachment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [sessionId, file]
              properties:
                sessionId: { type: string }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Managed image artifact
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ImageArtifact" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/turns:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      operationId: submitTurn
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              anyOf:
                - required: [text]
                - required: [content]
              properties:
                text: { type: string, minLength: 1 }
                content:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/TurnContentPart" }
                baseMessageId: { type: string }
                config:
                  type: object
                  additionalProperties: false
                  properties:
                    modelProfileId: { type: string }
                    candidateModelProfileIds: { type: array, items: { type: string } }
                    allowAutoRoute: { type: boolean }
                    toolPolicyProfileId: { type: string }
                    turnPolicyProfileId: { type: string }
                    visionPolicyProfileId: { type: string }
                    compactionPolicyProfileId: { type: string }
                    maxIterations: { type: integer, minimum: 1 }
                    toolExecution: { type: string, enum: [sequential, safe_parallel] }
                    maxConcurrentReadTools: { type: integer, minimum: 1 }
      responses:
        "202":
          description: Turn accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TurnSubmission" }
        "200":
          description: Existing idempotent submission
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TurnSubmission" }
        "409":
          $ref: "#/components/responses/Error"
  /v1/sessions/{sessionID}/invocations:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      operationId: submitInvocation
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target]
              anyOf:
                - required: [text]
                - required: [content]
              properties:
                text: { type: string, minLength: 1 }
                content:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/TurnContentPart" }
                baseMessageId: { type: string }
                target: { $ref: "#/components/schemas/InvocationTarget" }
                config: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Invocation accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TurnSubmission" }
        "200":
          description: Existing idempotent submission
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TurnSubmission" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/compactions:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      operationId: createContextCompaction
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseMessageId]
              additionalProperties: false
              properties:
                baseMessageId: { type: string }
                clientRequestId: { type: string }
                instructions: { type: string, maxLength: 4000 }
      responses:
        "202":
          description: Manual context compaction accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CompactionSubmission" }
        "200":
          description: Existing idempotent submission
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CompactionSubmission" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: listContextCompactions
      responses:
        "200":
          description: Session context checkpoints
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ContextCompaction" }
  /v1/compactions/{compactionID}:
    parameters:
      - name: compactionID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getContextCompaction
      responses:
        "200":
          description: Context checkpoint detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ContextCompaction" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/runs/{runID}:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      operationId: getRun
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AgentRun" }
        "404":
          $ref: "#/components/responses/Error"
  /v1/runs/{runID}/messages:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      operationId: listRunMessages
      parameters:
        - name: beforeOrdinal
          in: query
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Private Run transcript or deterministic legacy fallback
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RunMessagePage" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/runs/{runID}/children:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      operationId: listRunChildren
      responses:
        "200":
          description: Parent-visible delegated child activity
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DelegationActivityPage" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/delegations/{groupID}:
    parameters:
      - name: groupID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: inspectDelegation
      responses:
        "200":
          description: Parent-visible delegation projection
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DelegationInspection" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/delegations/{groupID}/retry:
    parameters:
      - name: groupID
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: retryDelegation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetryDelegationInput" }
      responses:
        "200":
          description: New retry generation, its child Runs, and optional pending approval
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    additionalProperties: false
                    required: [generation, childRunIds]
                    properties:
                      generation: { $ref: "#/components/schemas/DelegationGeneration" }
                      childRunIds: { type: array, items: { type: string } }
                      approval: { $ref: "#/components/schemas/DelegationApprovalRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/delegations/{groupID}/cancel:
    parameters:
      - name: groupID
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: cancelDelegation
      responses:
        "200":
          description: Active attempts of the current generation cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { type: object, properties: { status: { type: string } } }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/delegation-approvals/{approvalID}/decision:
    parameters:
      - name: approvalID
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: decideDelegationApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, clientRequestId]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                clientRequestId: { type: string }
      responses:
        "200":
          description: Committed decision and materialized child Runs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    additionalProperties: false
                    required: [approval, childRunIds]
                    properties:
                      approval: { $ref: "#/components/schemas/DelegationApprovalRequest" }
                      childRunIds: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/delegation-handles/{handleID}:
    parameters:
      - name: handleID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getDelegationHandle
      responses:
        "200":
          description: Durable delegation handle with its latest completion
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    additionalProperties: false
                    required: [handle]
                    properties:
                      handle: { $ref: "#/components/schemas/DelegationHandle" }
                      completion: { $ref: "#/components/schemas/DelegationCompletion" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/sessions/{sessionID}/delegation-handles:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      operationId: listSessionDelegationHandles
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, completed, cancelled] }
        - name: before
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Cursor-paginated handles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DelegationHandlePage" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/delivery-events:
    get:
      operationId: streamDeliveryEvents
      parameters:
        - name: sessionId
          in: query
          required: true
          schema: { type: string }
        - name: after
          in: query
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Replay-safe durable delivery event stream
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  data: { $ref: "#/components/schemas/DeliveryEvent" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/runs/{runID}/retry:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      operationId: retryRun
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                clientRequestId: { type: string }
      responses:
        "202":
          description: Safe retry attempt created and queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RunRetrySubmission" }
        "200":
          description: Existing idempotent retry submission
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RunRetrySubmission" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/runs/{runID}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      operationId: cancelRun
      responses:
        "200":
          description: Run cancelled or already terminal
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AgentRun" }
        "404":
          $ref: "#/components/responses/Error"
  /v1/runs/{runID}/inputs:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      operationId: queueRunInput
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, text]
              additionalProperties: false
              properties:
                kind: { type: string, enum: [steer, follow_up] }
                text: { type: string, minLength: 1 }
                clientRequestId: { type: string }
      responses:
        "202":
          description: Input queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/QueuedInput" }
        "409":
          $ref: "#/components/responses/Error"
  /v1/approval-requests/{approvalID}/decision:
    parameters:
      - name: approvalID
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: decideToolApproval
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [approved, rejected] }
                clientRequestId: { type: string }
      responses:
        "200":
          description: Approval decision stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ToolApprovalRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/runs/{runID}/events:
    parameters:
      - $ref: "#/components/parameters/RunID"
      - name: after
        in: query
        schema: { type: integer, format: int64, minimum: 0 }
      - name: Last-Event-ID
        in: header
        schema: { type: string }
    get:
      operationId: streamRunEvents
      responses:
        "200":
          description: Replayable server-sent event stream
          content:
            text/event-stream:
              schema: { type: string }
        "404":
          $ref: "#/components/responses/Error"

  # ——— Prompt Templates ———

  /v1/projects/{projectID}/prompt-templates:
    get:
      operationId: listPromptTemplates
      tags: [Prompt Templates]
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
      responses:
        "200":
          description: Effective template catalog
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PromptTemplateCatalog" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /v1/projects/{projectID}/prompt-templates/expand:
    post:
      operationId: expandPromptTemplate
      tags: [Prompt Templates]
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpandPromptTemplateInput" }
      responses:
        "200":
          description: Expand result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ExpandPromptTemplateResult" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /v1/prompt-templates:
    get:
      operationId: listGlobalPromptTemplates
      tags: [Prompt Templates]
      responses:
        "200":
          description: Management catalog
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PromptTemplateManagementCatalog" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      operationId: createPromptTemplate
      tags: [Prompt Templates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePromptTemplateInput" }
      responses:
        "201": { description: Created }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /v1/prompt-templates/{name}:
    get:
      operationId: getPromptTemplate
      tags: [Prompt Templates]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Template record
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      name: { type: string }
                      description: { type: string }
                      argumentHint: { type: string }
                      body: { type: string }
                      source: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    put:
      operationId: updatePromptTemplate
      tags: [Prompt Templates]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePromptTemplateInput" }
      responses:
        "200": { description: Updated }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deletePromptTemplate
      tags: [Prompt Templates]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ProjectID:
      name: projectID
      in: path
      required: true
      schema: { type: string }
    SessionID:
      name: sessionID
      in: path
      required: true
      schema: { type: string }
    RunID:
      name: runID
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Envelope:
      type: object
      properties:
        data: {}
    HealthEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [live, ready] }
            sandbox: { type: string }
            degraded: { type: boolean }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            retryable: { type: boolean }
    ProviderProfile:
      type: object
      required: [id, name, providerType, baseUrl, credentialRef, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        providerType: { type: string, enum: [openai-compatible] }
        baseUrl: { type: string, format: uri }
        credentialRef: { type: string }
        proxy: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProviderDiagnosticStage:
      type: object
      required: [name, status, message, latencyMs]
      properties:
        name: { type: string, enum: [configuration, credentials, model, generation] }
        status: { type: string, enum: [passed, failed] }
        message: { type: string }
        latencyMs: { type: integer, format: int64, minimum: 0 }
    ProviderFailure:
      type: object
      required: [category, message, retryable]
      properties:
        category:
          type: string
          enum:
            - configuration_invalid
            - credential_unavailable
            - endpoint_unreachable
            - authentication_failed
            - model_not_found
            - rate_limited
            - request_timeout
            - context_overflow
            - malformed_response
            - provider_internal_error
            - request_rejected
            - cancelled
            - unknown
        message: { type: string }
        retryable: { type: boolean }
        requestId: { type: string }
    ProviderDiagnostic:
      type: object
      required: [providerId, status, stages, latencyMs, testedAt]
      properties:
        providerId: { type: string }
        modelProfileId: { type: string }
        modelName: { type: string }
        status: { type: string, enum: [ready, failed] }
        failure: { $ref: "#/components/schemas/ProviderFailure" }
        stages:
          type: array
          items: { $ref: "#/components/schemas/ProviderDiagnosticStage" }
        latencyMs: { type: integer, format: int64, minimum: 0 }
        testedAt: { type: string, format: date-time }
    ThinkingEffort:
      type: string
      enum: [default, low, medium, high]
    ThinkingDialect:
      type: string
      enum: [none, openai_reasoning_effort]
    ModelProfile:
      type: object
      additionalProperties: false
      required: [id, providerId, modelName, displayName, contextWindow, maxOutputTokens, inputCostUsdMicrosPerMillion, outputCostUsdMicrosPerMillion, supportsVision, supportsToolUse, supportsThinking, thinkingDialect, supportedThinkingEfforts, isDefault, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        providerId: { type: string }
        modelName: { type: string }
        displayName: { type: string }
        contextWindow: { type: integer }
        maxOutputTokens: { type: integer }
        inputCostUsdMicrosPerMillion: { type: integer, minimum: 0, maximum: 1000000000 }
        outputCostUsdMicrosPerMillion: { type: integer, minimum: 0, maximum: 1000000000 }
        supportsVision: { type: boolean }
        supportsToolUse: { type: boolean }
        supportsThinking: { type: boolean }
        thinkingDialect: { $ref: "#/components/schemas/ThinkingDialect" }
        supportedThinkingEfforts:
          type: array
          items: { $ref: "#/components/schemas/ThinkingEffort" }
        isDefault: { type: boolean }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PolicyProfile:
      type: object
      required: [id, name, kind, version, config, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [tool, turn, vision, compaction] }
        version: { type: integer }
        config: { type: object, additionalProperties: true }
        status: { type: string, enum: [active, inactive] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ImageArtifact:
      type: object
      required: [id, projectId, name, kind, mimeType, sizeBytes, sha256, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        sessionId: { type: string }
        name: { type: string }
        kind: { type: string, enum: [image, image_attachment] }
        mimeType: { type: string, enum: [image/png, image/jpeg, image/gif] }
        sizeBytes: { type: integer, format: int64 }
        sha256: { type: string }
        width: { type: integer }
        height: { type: integer }
        createdAt: { type: string, format: date-time }
    ArtifactReference:
      type: object
      required: [artifactId, name, kind, mimeType, sizeBytes, sha256]
      additionalProperties: false
      properties:
        artifactId: { type: string }
        name: { type: string }
        kind: { type: string, enum: [image, table, static_html, text, file] }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        sha256: { type: string }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
    Artifact:
      type: object
      required: [id, projectId, name, kind, mimeType, sizeBytes, sha256, retentionClass, createdAt]
      additionalProperties: false
      properties:
        id: { type: string }
        projectId: { type: string }
        sessionId: { type: string }
        messageId: { type: string }
        runId: { type: string }
        name: { type: string }
        kind: { type: string, enum: [image, image_attachment, table, static_html, text, file] }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        sha256: { type: string }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        sourceToolCallId: { type: string }
        sourceKind: { type: string }
        retentionClass: { type: string, enum: [project] }
        createdAt: { type: string, format: date-time }
    TablePreview:
      type: object
      required: [format, columns, rows, truncatedRows, truncatedColumns, rowLimit, columnLimit]
      additionalProperties: false
      properties:
        format: { type: string, enum: [csv, tsv, xlsx] }
        sheets:
          type: array
          items: { type: string }
        sheet: { type: string }
        columns:
          type: array
          maxItems: 30
          items: { type: string }
        rows:
          type: array
          maxItems: 100
          items:
            type: array
            maxItems: 30
            items: { type: string }
        truncatedRows: { type: boolean }
        truncatedColumns: { type: boolean }
        rowLimit: { type: integer, const: 100 }
        columnLimit: { type: integer, const: 30 }
    TextPreview:
      type: object
      required: [text, truncated]
      additionalProperties: false
      properties:
        text: { type: string }
        truncated: { type: boolean }
    TurnContentPart:
      oneOf:
        - type: object
          required: [type, text]
          additionalProperties: false
          properties:
            type: { type: string, const: text }
            text: { type: string, minLength: 1 }
        - type: object
          required: [type, artifactId]
          additionalProperties: false
          properties:
            type: { type: string, const: image }
            artifactId: { type: string }
    InvocationTarget:
      oneOf:
        - $ref: "#/components/schemas/HostInvocationTarget"
        - $ref: "#/components/schemas/RoleInvocationTarget"
