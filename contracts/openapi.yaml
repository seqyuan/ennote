          type: object
          required: [id, name, arguments]
          additionalProperties: false
          properties:
            id: { type: string }
            name: { type: string }
            arguments: { type: object, additionalProperties: true }
            argumentsFragment: { type: string }
            partial: { type: boolean }
    ToolResultContentBlock:
      type: object
      required: [type, toolResult]
      additionalProperties: false
      properties:
        type: { type: string, const: tool_result }
        toolResult:
          type: object
          required: [toolCallId, toolName, content, isError]
          additionalProperties: false
          properties:
            toolCallId: { type: string }
            toolName: { type: string }
            content: { type: string }
            isError: { type: boolean }
            artifacts:
              type: array
              items: { $ref: "#/components/schemas/ArtifactReference" }
    ImageContentBlock:
      type: object
      required: [type, image]
      additionalProperties: false
      properties:
        type: { type: string, const: image }
        image:
          type: object
          required: [artifactId, mimeType, sha256, width, height]
          additionalProperties: false
          properties:
            artifactId: { type: string }
            mimeType: { type: string }
            sha256: { type: string }
            width: { type: integer }
            height: { type: integer }
    ImageDescriptionContentBlock:
      type: object
      required: [type, imageDescription]
      additionalProperties: false
      properties:
        type: { type: string, const: image_description }
        imageDescription:
          type: object
          required: [artifactId, text, modelId, promptVersion]
          additionalProperties: false
          properties:
            artifactId: { type: string }
            text: { type: string }
            modelId: { type: string }
            promptVersion: { type: string }
    RunEvent:
      type: object
      required: [eventId, runId, seq, type, payload, createdAt]
