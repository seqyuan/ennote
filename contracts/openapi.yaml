      type: object
      additionalProperties: false
      required: [id, roleId, version, definition, configDigest, status, createdAt]
      properties:
        id: { type: string }
        roleId: { type: string }
        version: { type: integer, minimum: 1 }
        definition: { $ref: "#/components/schemas/RoleDefinition" }
        configDigest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        status: { type: string, enum: [published] }
        createdAt: { type: string, format: date-time }
    RoleCatalogPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RoleSummary" } }
        nextCursor: { type: string }
    RoleValidationDiagnostic:
      type: object
      additionalProperties: false
      required: [level, code, message]
      properties:
        level: { type: string, enum: [error, warning] }
        code: { type: string }
        message: { type: string }
        field: { type: string }
    RoleValidationResult:
      type: object
      additionalProperties: false
      required: [valid, diagnostics]
      properties:
        valid: { type: boolean }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/RoleValidationDiagnostic" } }
        configDigest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
    CreateRoleInput:
      type: object
      additionalProperties: false
      required: [handle, name, scope, definition]
      properties:
        handle: { type: string, pattern: "^[a-z][a-z0-9_-]{1,31}$" }
        name: { type: string, minLength: 1 }
        description: { type: string }
        positioning: { type: string }
        icon: { type: string }
        color: { type: string }
        scope: { $ref: "#/components/schemas/RoleScope" }
        projectId: { type: string }
        definition: { $ref: "#/components/schemas/RoleDefinition" }
    UpdateRoleDraftInput:
      type: object
      additionalProperties: false
      required: [expectedRevision, definition]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        handle: { type: string, pattern: "^[a-z][a-z0-9_-]{1,31}$" }
        name: { type: string, minLength: 1 }
        description: { type: string }
        positioning: { type: string }
        icon: { type: string }
        color: { type: string }
        definition: { $ref: "#/components/schemas/RoleDefinition" }
    SystemPromptMetadata:
      type: object
      additionalProperties: false
      required: [version, platformVersion, digest]
      properties:
        version: { type: integer, minimum: 1 }
        agentProfileId: { type: string }
        platformVersion: { type: string }
        digest: { type: string, minLength: 1 }
    AgentRun:
      type: object
      additionalProperties: false
      required: [id, sessionId, runKind, attempt, status, commitFormatVersion, executionDepth, publishMode, speakerSnapshot, contextSnapshot, requestedConfig, effectiveConfig, createdAt]
      properties:
        id: { type: string }
        turnId: { type: string }
        sessionId: { type: string }
        runKind: { type: string, enum: [agent, context_compaction, delegated_agent] }
        baseMessageId: { type: string }
        attempt: { type: integer }
        status: { type: string, enum: [queued, running, waiting_for_approval, waiting_delegation_admission, waiting_children, succeeded, failed, cancelled, interrupted] }
        assistantMessageId: { type: string }
        retryOfRunId: { type: string }
        commitFormatVersion: { type: integer, enum: [1, 2] }
        systemPrompt: { $ref: "#/components/schemas/SystemPromptMetadata" }
        parentRunId: { type: string }
        rootRunId: { type: string }
        executionDepth: { type: integer, minimum: 0 }
        publishMode: { type: string, enum: [public_final, private_to_parent] }
        speakerSnapshot: { $ref: "#/components/schemas/SpeakerSnapshot" }
        contextSnapshot: { type: object, additionalProperties: true }
        contextSnapshotDigest: { type: string }
        requestedConfig: { type: object, additionalProperties: true }
        effectiveConfig: { type: object, additionalProperties: true }
        errorCode: { type: string }
        errorMessage: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    RunRecovery:
      type: object
      required: [run, retryable]
      properties:
        run: { $ref: "#/components/schemas/AgentRun" }
        retryable: { type: boolean }
        blockedReason:
          type: string
          enum: [active_run, inactive_turn, not_latest_attempt, projected_output, side_effect_boundary]
    RunRetrySubmission:
      type: object
      required: [sourceRunId, run, existing]
      properties:
        sourceRunId: { type: string }
        run: { $ref: "#/components/schemas/AgentRun" }
        existing: { type: boolean }
    DelegationApprovalPreview:
      type: object
      additionalProperties: false
      required: [name, roleHandle, assignmentPreview, outputContract, budget]
      properties:
        name: { type: string }
        roleHandle: { type: string }
        assignmentPreview: { type: string, maxLength: 240 }
        outputContract: { type: string }
        budget: { $ref: "#/components/schemas/DelegationBudgetCeiling" }
    DelegationTerminalResult:
      type: object
      additionalProperties: false
      required: [status, summary]
      properties:
        status: { type: string, enum: [completed, blocked, needs_input] }
        summary: { type: string }
        artifactRefs:
          type: array
          items: { $ref: "#/components/schemas/ArtifactReference" }
        payload: { type: object, additionalProperties: true }
    DelegationChildActivity:
      type: object
      additionalProperties: false
      required: [itemId, name, roleHandle, roleDisplayName, itemStatus, createdAt]
      properties:
        itemId: { type: string }
        childRunId: { type: string }
        name: { type: string }
        roleHandle: { type: string }
        roleDisplayName: { type: string }
        itemStatus: { type: string, enum: [pending, running, succeeded, failed, cancelled, not_authorized] }
        runStatus: { type: string, enum: [queued, running, waiting_for_approval, waiting_delegation_admission, waiting_children, succeeded, failed, cancelled, interrupted] }
        result: { $ref: "#/components/schemas/DelegationTerminalResult" }
        errorCode: { type: string }
        errorMessage: { type: string }
        createdAt: { type: string, format: date-time }
    DelegationActivityGroup:
      type: object
      additionalProperties: false
      required: [id, parentToolCallId, strategy, status, children, createdAt]
      properties:
        id: { type: string }
        parentToolCallId: { type: string }
        strategy: { type: string, enum: [single, parallel] }
        status: { type: string, enum: [pending, waiting_admission, waiting_children, settled, cancelled] }
        children:
          type: array
          items: { $ref: "#/components/schemas/DelegationChildActivity" }
        createdAt: { type: string, format: date-time }
    DelegationActivityPage:
      type: object
      additionalProperties: false
      required: [parentRunId, groups]
      properties:
        parentRunId: { type: string }
        groups:
          type: array
          items: { $ref: "#/components/schemas/DelegationActivityGroup" }
    DelegationInspection:
      type: object
      additionalProperties: false
      required: [group, currentGeneration, items, generations, validActions]
      properties:
        group: { $ref: "#/components/schemas/DelegationGroup" }
        currentGeneration: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: "#/components/schemas/DelegationInspectionItem" }
        generations:
          type: array
          items: { $ref: "#/components/schemas/DelegationGeneration" }
        pendingApproval: { $ref: "#/components/schemas/DelegationApprovalRequest" }
        validActions:
          type: array
          items: { type: string, enum: [retry, cancel, decide_approval] }
    DelegationInspectionItem:
      type: object
      additionalProperties: false
      required: [itemId, name, status, attempts]
      properties:
        itemId: { type: string }
        name: { type: string }
        status: { type: string, enum: [pending, running, succeeded, failed, cancelled, not_authorized] }
        attempts:
          type: array
          items: { $ref: "#/components/schemas/DelegationAttemptSummary" }
    DelegationAttemptSummary:
      type: object
      additionalProperties: false
      required: [attemptId, generation, childRunId, status, usage]
      properties:
        attemptId: { type: string }
        generation: { type: integer, minimum: 0 }
        childRunId: { type: string }
        status: { type: string, enum: [queued, running, succeeded, blocked, needs_input, not_authorized, failed, cancelled, interrupted] }
        result: { $ref: "#/components/schemas/SubmitResult" }
        resultDigest: { type: string }
        usage: { $ref: "#/components/schemas/RunBudgetUsage" }
        errorCode: { type: string }
    RunBudgetUsage:
      type: object
      additionalProperties: false
      required: [modelCalls, toolCalls, tokens, outputTokens, costMicros]
      properties:
        modelCalls: { type: integer }
        toolCalls: { type: integer }
        tokens: { type: integer }
        outputTokens: { type: integer }
        costMicros: { type: integer }
    DelegationGeneration:
      type: object
      additionalProperties: false
      required: [id, groupId, generation, kind, status, retrySelection, reusedAttempts, clientRequestId, createdAt]
      properties:
        id: { type: string }
        groupId: { type: string }
        generation: { type: integer, minimum: 0 }
        kind: { type: string, enum: [initial, retry, input, follow_up] }
        status: { type: string, enum: [awaiting_authorization, queued, running, settled, failed, cancelled] }
        retrySelection:
          type: array
          items: { type: string }
        reusedAttempts:
          type: array
          items: { $ref: "#/components/schemas/DelegationAttemptReference" }
        authorizationSnapshot: { type: object }
        budgetSnapshot: { type: object }
        clientRequestId: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    DelegationAttemptReference:
      type: object
      additionalProperties: false
      required: [itemId, attemptId, generation, childRunId]
      properties:
        itemId: { type: string }
        attemptId: { type: string }
        generation: { type: integer }
        childRunId: { type: string }
        resultDigest: { type: string }
    RetryDelegationInput:
      type: object
      additionalProperties: false
      required: [expectedGeneration, itemIds, clientRequestId]
      properties:
        expectedGeneration: { type: integer, minimum: 0 }
        itemIds:
          type: array
          minItems: 1
          items: { type: string }
        budgetOverrides:
          type: object
          additionalProperties: { $ref: "#/components/schemas/DelegationBudgetCeiling" }
        clientRequestId: { type: string }
    DelegationApprovalRequest:
      type: object
      additionalProperties: false
      required: [id, groupId, generation, kind, parentRunId, sessionId, status, items, requestedAt]
      properties:
        id: { type: string }
        groupId: { type: string }
        generation: { type: integer }
        kind: { type: string, enum: [retry_budget] }
        parentRunId: { type: string }
        sessionId: { type: string }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        items:
          type: array
          items: { type: object }
        requestedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
    DelegationHandle:
      type: object
      additionalProperties: false
      required: [id, groupId, sessionId, sourceParentRunId, sourceBranchId, executionMode, autoResume, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        groupId: { type: string }
        sessionId: { type: string }
        sourceParentRunId: { type: string }
        sourceBranchId: { type: string }
        executionMode: { type: string, enum: [blocking, background] }
        autoResume: { type: boolean }
        status: { type: string, enum: [active, completed, cancelled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DelegationHandlePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DelegationHandle" }
        nextCursor: { type: string }
    DelegationCompletion:
      type: object
      additionalProperties: false
      required: [id, handleId, sessionId, generation, kind, result, resultDigest, sequence, deliveryStatus, createdAt]
      properties:
        id: { type: string }
        handleId: { type: string }
        sessionId: { type: string }
        generation: { type: integer }
        kind: { type: string, enum: [completed, partial, failed, cancelled] }
        result: { type: object }
        resultDigest: { type: string }
        sequence: { type: integer }
        deliveryStatus: { type: string, enum: [pending, consumed_by_parent, notified, resume_queued, resume_completed] }
        createdAt: { type: string, format: date-time }
    DeliveryEvent:
      type: object
      additionalProperties: false
      required: [eventId, sessionId, sourceKind, sourceId, sourceGeneration, eventType, payload, createdAt]
      properties:
        eventId: { type: integer, format: int64 }
        sessionId: { type: string }
        sourceKind: { type: string }
        sourceId: { type: string }
        sourceGeneration: { type: integer }
        eventType: { type: string }
        payload: { type: object }
        createdAt: { type: string, format: date-time }
    DelegationGroup:
      type: object
      additionalProperties: false
      required: [id, parentRunId, parentToolCallId, strategy, status, createdAt]
      properties:
        id: { type: string }
        parentRunId: { type: string }
        parentToolCallId: { type: string }
        strategy: { type: string, enum: [single, parallel] }
        status: { type: string, enum: [pending, waiting_admission, waiting_children, settled, cancelled] }
        createdAt: { type: string, format: date-time }
    ApprovalItem:
      type: object
      required: [callIndex, toolCallId, toolName, riskClass, argumentsPreview]
      properties:
        callIndex: { type: integer, minimum: 0 }
        toolCallId: { type: string }
        toolName: { type: string }
        riskClass: { type: string, enum: [read_only, local_write, shell, external, delegation, sensitive] }
        argumentsPreview: { type: string, maxLength: 400 }
        delegations:
          type: array
          items: { $ref: "#/components/schemas/DelegationApprovalPreview" }
    ApprovalAttribution:
      type: object
      additionalProperties: false
      required: [speakerKind, displayName]
      properties:
        speakerKind: { type: string, enum: [user, host, role, workflow, room, system] }
        objectId: { type: string }
        versionId: { type: string }
        handle: { type: string }
        displayName: { type: string }
        permissionCeiling: { type: string, enum: [discuss, ask, auto] }
        authority: { type: string, enum: [read_only, mutation] }
    ToolApprovalRequest:
      type: object
      required: [id, runId, sessionId, iteration, batchDigest, status, items, requestedAt]
      properties:
        id: { type: string }
        runId: { type: string }
        sessionId: { type: string }
        iteration: { type: integer, minimum: 1 }
        batchDigest: { type: string }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        items:
          type: array
          items: { $ref: "#/components/schemas/ApprovalItem" }
        requestedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        attribution: { $ref: "#/components/schemas/ApprovalAttribution" }
    ActiveRunState:
      type: object
      required: [run]
      properties:
        run: { $ref: "#/components/schemas/AgentRun" }
        pendingApproval: { $ref: "#/components/schemas/ToolApprovalRequest" }
    TurnSubmission:
      type: object
      required: [turnId, userMessageId, run, existing]
      properties:
        turnId: { type: string }
        userMessageId: { type: string }
        run: { $ref: "#/components/schemas/AgentRun" }
        existing: { type: boolean }
    CompactionSubmission:
      type: object
      required: [runId, compactionId, status, existing]
      properties:
        runId: { type: string }
        compactionId: { type: string }
        status: { type: string }
        existing: { type: boolean }
    ContextCompaction:
      type: object
      required: [id, sessionId, status, reason, requestedConfig, effectiveConfig, baseLeafMessageId,
        firstKeptMessageId, sourceDigest, summaryContractDigest, summary, summaryDigest, promptVersion,
        tokensBefore, estimatedTokensAfter, reclaimedTokens, createdAt]
      properties:
        id: { type: string }
        runId: { type: string }
        sessionId: { type: string }
        clientRequestId: { type: string }
        status: { type: string, enum: [planned, running, completed, failed, cancelled] }
        reason: { type: string, enum: [manual, threshold, overflow] }
        policyProfileId: { type: string }
        policyVersion: { type: integer }
        requestedConfig: { type: object, additionalProperties: true }
        effectiveConfig: { type: object, additionalProperties: true }
        baseLeafMessageId: { type: string }
        previousCompactionId: { type: string }
        sourceFromMessageId: { type: string }
        sourceThroughMessageId: { type: string }
        firstKeptMessageId: { type: string }
        sourceDigest: { type: string }
        summaryContractDigest: { type: string }
        summary: { type: string }
        summaryDigest: { type: string }
        promptVersion: { type: string }
        modelCallId: { type: string }
        tokensBefore: { type: integer }
        estimatedTokensAfter: { type: integer }
        reclaimedTokens: { type: integer }
        errorCode: { type: string }
        errorMessage: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    QueuedInput:
      type: object
      required: [id, runId, sessionId, clientRequestId, seq, kind, text, status, createdAt]
      properties:
        id: { type: string }
        runId: { type: string }
        sessionId: { type: string }
        clientRequestId: { type: string }
        seq: { type: integer, format: int64 }
        kind: { type: string, enum: [steer, follow_up] }
        text: { type: string }
        status: { type: string, enum: [queued, injected, cancelled] }
        createdAt: { type: string, format: date-time }
        injectedAt: { type: string, format: date-time }
    # ——— Prompt Templates ———
    PromptTemplateSummary:
      type: object
      required: [name, description, argumentHint, source, editable]
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
        argumentHint: { type: string }
        source: { type: string, enum: [builtin, settings, global, project] }
        editable: { type: boolean }
    PromptTemplateDiagnostic:
      type: object
      additionalProperties: false
      properties:
        level: { type: string, enum: [info, warning] }
        code: { type: string }
        source: { type: string }
        path: { type: string }
        name: { type: string }
        message: { type: string }
    GlobalPromptTemplateEntry:
      type: object
      required: [name, valid, editable]
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
        argumentHint: { type: string }
        valid: { type: boolean }
        editable: { type: boolean }
        diagnostic: { $ref: '#/components/schemas/PromptTemplateDiagnostic' }
    ExpandPromptTemplateInput:
      type: object
      required: [invocation]
      additionalProperties: false
      properties:
        invocation: { type: string }
    ExpandPromptTemplateMatched:
      type: object
      required: [case, name, text, diagnostics]
      additionalProperties: false
      properties:
        case: { type: string, const: matched }
        name: { type: string }
        text: { type: string }
        diagnostics: { type: array, items: { $ref: '#/components/schemas/PromptTemplateDiagnostic' } }
    ExpandPromptTemplateNotFound:
      type: object
      required: [case, name, diagnostics]
      additionalProperties: false
      properties:
        case: { type: string, const: not_found }
        name: { type: string }
        diagnostics: { type: array, items: { $ref: '#/components/schemas/PromptTemplateDiagnostic' } }
    ExpandPromptTemplateInvalid:
      type: object
      required: [case, diagnostics]
      additionalProperties: false
      properties:
        case: { type: string, const: invalid_invocation }
        diagnostics: { type: array, items: { $ref: '#/components/schemas/PromptTemplateDiagnostic' }, maxItems: 0 }
    ExpandPromptTemplateResult:
      oneOf:
        - { $ref: '#/components/schemas/ExpandPromptTemplateMatched' }
        - { $ref: '#/components/schemas/ExpandPromptTemplateNotFound' }
        - { $ref: '#/components/schemas/ExpandPromptTemplateInvalid' }
    CreatePromptTemplateInput:
      type: object
      required: [name, body]
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
        argumentHint: { type: string }
        body: { type: string }
    UpdatePromptTemplateInput:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        description: { type: string }
        argumentHint: { type: string }
        body: { type: string }
    PromptTemplateCatalog:
      type: object
      required: [templates, diagnostics]
      additionalProperties: false
      properties:
        templates: { type: array, items: { $ref: '#/components/schemas/PromptTemplateSummary' } }
        diagnostics: { type: array, items: { $ref: '#/components/schemas/PromptTemplateDiagnostic' } }
    PromptTemplateManagementCatalog:
      type: object
      required: [templates, globalTemplates, globalRecoveryMode, diagnostics]
      additionalProperties: false
      properties:
        templates: { type: array, items: { $ref: '#/components/schemas/PromptTemplateSummary' } }
        globalTemplates: { type: array, items: { $ref: '#/components/schemas/GlobalPromptTemplateEntry' } }
        globalRecoveryMode: { type: boolean }
        diagnostics: { type: array, items: { $ref: '#/components/schemas/PromptTemplateDiagnostic' } }
