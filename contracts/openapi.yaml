          properties:
            draft: { $ref: "#/components/schemas/RoleDefinition" }
            draftRevision: { type: integer, minimum: 0 }
            delegationEnabled: { type: boolean }
            delegationRevocationEpoch: { type: integer, minimum: 0 }
            delegationDisabledAt: { type: string, format: date-time }
            createdAt: { type: string, format: date-time }
