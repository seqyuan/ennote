      responses:
        "200":
          description: Stable branch identities for this Session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/SessionBranch" }
        "404": { $ref: "#/components/responses/Error" }
