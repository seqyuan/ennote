      properties:
        mode: { type: string, enum: [fixed, overridable, inherit] }
        modelProfileId: { type: string }
        thinkingEffort: { $ref: "#/components/schemas/ThinkingEffort" }
        fallbackModelProfileIds: { type: array, uniqueItems: true, items: { type: string } }
        overridableFields: { type: array, uniqueItems: true, items: { type: string } }
    RoleSkillEntry:
      type: object
      additionalProperties: false
      required: [skillId, mode]
      properties:
        skillId: { type: string }
        mode: { type: string, enum: [preload, available] }
