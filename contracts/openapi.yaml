                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PromptTemplateManagementCatalog" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      operationId: createPromptTemplate
      tags: [Prompt Templates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePromptTemplateInput" }
      responses:
        "201": { description: Created }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /v1/prompt-templates/{name}:
    get:
      operationId: getPromptTemplate
      tags: [Prompt Templates]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Template record
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      name: { type: string }
                      description: { type: string }
                      argumentHint: { type: string }
                      body: { type: string }
                      source: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    put:
      operationId: updatePromptTemplate
      tags: [Prompt Templates]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePromptTemplateInput" }
      responses:
        "200": { description: Updated }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deletePromptTemplate
      tags: [Prompt Templates]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /v1/skills/roots:
    get:
      operationId: listSkillRoots
      summary: List configured additional skills directories
      responses:
        "200":
          description: Configured roots ordered by priority
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/SkillRoot" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSkillRoot
      summary: Add an additional skills directory (by path or ecosystem preset)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string }
                path: { type: string, description: "Explicit absolute path; or leave empty and use agentKind" }
                agentKind: { type: string, enum: [pi, claude, codex, cursor, generic], description: "Preset resolving to the ecosystem skills dir under the worker home" }
                priority: { type: integer, minimum: 1 }
                enabled: { type: boolean }
      responses:
        "201":
          description: Root created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SkillRoot" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/skills/roots/{rootID}:
    parameters:
      - name: rootID
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateSkillRoot
      summary: Patch name, path, agent kind, priority, or enabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                path: { type: string }
                agentKind: { type: string, enum: [pi, claude, codex, cursor, generic] }
                priority: { type: integer, minimum: 1 }
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated root
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SkillRoot" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSkillRoot
      summary: Remove an additional skills directory
      responses:
        "204":
          description: Root removed
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  # ——— Skills management ———

  /v1/skills:
    get:
      operationId: listSkills
      summary: List the merged skill catalog with pi-ecosystem install annotations
      parameters:
        - name: projectID
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Catalog skills, diagnostics, and (for a project) trust status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SkillListResult" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/skills/disabled/{relPath}:
    parameters:
      - name: relPath
        in: path
        required: true
        schema: { type: string, description: Skill rel path inside the user skills root; may contain slashes }
    patch:
      operationId: toggleSkillDisabled
      summary: Set or clear disable-model-invocation on a skill's SKILL.md
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [disabled]
              properties:
                disabled: { type: boolean }
      responses:
        "204":
          description: Toggle applied
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/skills/search:
    get:
      operationId: searchSkills
      summary: Search the skills.sh registry (with npx find fallback)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [results]
                        properties:
                          results:
                            type: array
                            items: { $ref: "#/components/schemas/SkillSearchResult" }
        "401": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/skills/install:
    post:
      operationId: installSkill
      summary: Install a skill via the skills.sh CLI (global, or project when trusted)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [package, scope]
              properties:
                package: { type: string }
                scope: { type: string, enum: [global, project] }
                projectId: { type: string }
      responses:
        "200":
          description: Install result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [success]
                        properties:
                          success: { type: boolean }
                          output: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/skills/check:
    post:
      operationId: checkSkillUpdates
      summary: Compare recorded version hashes against the remote registry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                projectId: { type: string }
                package: { type: string }
                scope: { type: string, enum: [global, project] }
      responses:
        "200":
          description: Per-install update states
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [updates]
                        properties:
                          updates:
                            type: array
                            items: { $ref: "#/components/schemas/SkillUpdateResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/skills/update:
    post:
      operationId: updateSkill
      summary: Re-install an existing skill to the latest version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [package, scope]
              properties:
                projectId: { type: string }
                package: { type: string }
                scope: { type: string, enum: [global, project] }
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [success]
                        properties:
                          success: { type: boolean }
                          output: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/skills/remove/{relPath}:
    parameters:
      - name: relPath
        in: path
        required: true
        schema: { type: string, description: Skill rel path inside the user skills root; may contain slashes }
    post:
      operationId: removeSkill
      summary: Remove a globally installed skill
      responses:
        "204":
          description: Skill removed
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ProjectID:
      name: projectID
      in: path
      required: true
      schema: { type: string }
    SessionID:
      name: sessionID
      in: path
      required: true
      schema: { type: string }
    RunID:
      name: runID
      in: path
      required: true
      schema: { type: string }
    ProfileID:
      name: profileID
      in: path
      required: true
      schema: { type: string }
    BindingID:
      name: bindingID
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Envelope:
      type: object
      properties:
        data: {}
    RuntimeInfo:
      type: object
      required: [instanceId]
      additionalProperties: false
      properties:
        instanceId: { type: string, minLength: 1 }
    MCPServerProfile:
      type: object
      properties:
        id: { type: string }
        displayName: { type: string }
        slug: { type: string }
        sourceKind: { type: string, enum: [managed, project_file, bundled] }
        projectScope: { type: string, nullable: true }
        sourceLocator: { type: string }
        lifecycleStatus: { type: string, enum: [active, archived] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        latestVersion: { type: integer }
    MCPServerProfileVersion:
      type: object
      required: [transport]
      properties:
        id: { type: string }
        profileId: { type: string }
        version: { type: integer }
        transport: { type: string, enum: [stdio, streamable_http, legacy_sse] }
        executable: { type: string }
        argv: { type: array, items: { type: string } }
        endpoint: { type: string }
        envLiterals:
          type: object
          additionalProperties: { type: string }
        envCredentials:
          type: object
          description: Secret env references (env:/file:/keyring:) only; values never persisted
          additionalProperties: { type: string }
        headerLiterals:
          type: object
          additionalProperties: { type: string }
        headerCredentials:
          type: object
          additionalProperties: { type: string }
        cwd: { type: string }
        timeoutMs: { type: integer, default: 15000 }
        networkPolicy: { type: string, enum: [default, loopback, private, custom_ca, insecure], default: default }
        configDigest: { type: string }
        createdAt: { type: string, format: date-time }
    MCPProjectBinding:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        profileVersionId: { type: string }
        desiredEnabled: { type: boolean }
        required: { type: boolean }
        selectedRemoteToolNames:
          type: array
          items: { type: string }
        credentialRefs:
          type: object
          additionalProperties: { type: string }
        revision: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AgentFlowVersion:
      type: object
      properties:
        id: { type: string }
        profileId: { type: string }
        version: { type: integer }
        configDigest: { type: string }
        definition:
          type: object
          description: The normalized flow definition (never contains secrets)
          properties:
            schemaVersion: { type: integer }
            id: { type: string }
            description: { type: string }
            inputs: { type: object, additionalProperties: true }
            outputs: { type: object, additionalProperties: true }
            budget:
              type: object
              properties:
                maxTotalTokens: { type: integer }
            tasks: { type: object, additionalProperties: true }
            convergence:
              type: array
              items:
                type: object
                properties:
                  from: { type: string }
                  to: { type: string }
                  maxRounds: { type: integer }
        publishedAt: { type: string }
    RunAgentFlow:
      type: object
      properties:
        runId: { type: string }
        sessionId: { type: string }
        projectId: { type: string }
        flowVersionId: { type: string }
        manifestDigest: { type: string }
        state: { type: string, enum: [pending, running, completed, failed, cancelled, convergence_exceeded, budget_exceeded] }
        totalTokensUsed: { type: integer }
        terminalReason: { type: string }
        inputs: { type: object, additionalProperties: true }
        createdAt: { type: string }
        updatedAt: { type: string }
        finishedAt: { type: string }
    RunAgentFlowNode:
      type: object
      properties:
        runId: { type: string }
        taskIndex: { type: integer }
        handle: { type: string }
        roleVersionId: { type: string }
        skillDigests: { type: array, items: { type: string } }
        goalDigest: { type: string }
        goalText: { type: string }
        budget: { type: object, additionalProperties: true }
        terminalState: { type: string, enum: [pending, running, completed, failed, blocked, cancelled, interrupted] }
        outputRef: { type: object, additionalProperties: true }
        childRunId: { type: string }
        errorCode: { type: string }
        createdAt: { type: string }
        finishedAt: { type: string }
    FlowDependencyStatus:
      type: object
      properties:
        kind: { type: string, enum: [role, skill] }
        name: { type: string }
        version: { type: integer }
        present: { type: boolean }
        reason: { type: string }
    FlowValidationDiagnostic:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        field: { type: string }
    FlowValidationResult:
      type: object
      properties:
        valid: { type: boolean }
        configDigest: { type: string }
        diagnostics:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
              field: { type: string }
    MCPCatalogEntry:
      type: object
      properties:
        remoteName: { type: string }
        exposedName: { type: string }
        description: { type: string }
        inputSchema: {}
        outputSchema: {}
        readOnlyHint: { type: boolean }
        digest: { type: string }
    MCPCandidate:
      type: object
      properties:
        slug: { type: string }
        displayName: { type: string }
        sourceKind: { type: string, enum: [managed, project_file, bundled] }
        sourceLocator: { type: string }
        transport: { type: string }
        executable: { type: string }
        endpoint: { type: string }
        configDigest: { type: string }
        boundVersionId: { type: string }
        alreadyBound: { type: boolean }
        updateAvailable: { type: boolean }
    BundledDescriptor:
      type: object
      description: Ennote's local trust declaration for a bundled MCP server; metadata only, never auto-executed
      properties:
        slug: { type: string }
        displayName: { type: string }
        version: { type: string }
        publisher: { type: string }
        license: { type: string }
        description: { type: string }
        transport: { type: string }
        command: { type: string }
        args: { type: array, items: { type: string } }
        endpoint: { type: string }
        credentialRequirements:
          type: array
          items:
            type: object
            properties:
              envName: { type: string }
              required: { type: boolean }
        payloadDelivery: { type: string, enum: [embedded, on_demand_download, external_command] }
        payloadDigest: { type: string }
        riskManifest:
          type: array
          items:
            type: object
            properties:
              remoteName: { type: string }
              riskClass: { type: string }
        readOnlyOnly: { type: boolean }
    HealthEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [live, ready] }
            sandbox: { type: string }
            degraded: { type: boolean }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            retryable: { type: boolean }
    ProviderProfile:
      type: object
      required: [id, name, providerType, baseUrl, credentialConfigured, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        providerType: { type: string, enum: [openai-compatible, anthropic] }
        api: { type: string }
        baseUrl: { type: string, format: uri }
        credentialConfigured: { type: boolean }
        proxy: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DiscoveredModel:
      type: object
      required: [modelName]
      additionalProperties: false
      properties:
        modelName: { type: string }
        displayName: { type: string }
        contextWindow: { type: integer, minimum: 0 }
        maxOutputTokens: { type: integer, minimum: 0 }
        supportsVision: { type: boolean }
        supportsThinking: { type: boolean }
    ProviderDiagnosticStage:
      type: object
      required: [name, status, message, latencyMs]
      properties:
        name: { type: string, enum: [configuration, credentials, model, generation] }
        status: { type: string, enum: [passed, failed] }
        message: { type: string }
        latencyMs: { type: integer, format: int64, minimum: 0 }
    ProviderFailure:
      type: object
      required: [category, message, retryable]
      properties:
        category:
          type: string
          enum:
            - configuration_invalid
            - credential_unavailable
            - endpoint_unreachable
            - authentication_failed
            - model_not_found
            - rate_limited
            - request_timeout
            - context_overflow
            - malformed_response
            - provider_internal_error
            - request_rejected
            - cancelled
            - unknown
        message: { type: string }
        retryable: { type: boolean }
        requestId: { type: string }
    ProviderDiagnostic:
      type: object
      required: [providerId, status, stages, latencyMs, testedAt]
      properties:
        providerId: { type: string }
        modelProfileId: { type: string }
        modelName: { type: string }
        status: { type: string, enum: [ready, failed] }
        failure: { $ref: "#/components/schemas/ProviderFailure" }
        stages:
          type: array
          items: { $ref: "#/components/schemas/ProviderDiagnosticStage" }
        latencyMs: { type: integer, format: int64, minimum: 0 }
        testedAt: { type: string, format: date-time }
    ThinkingEffort:
      type: string
      enum: [default, low, medium, high]
    ThinkingDialect:
      type: string
      enum: [none, openai_reasoning_effort]
    ModelProfile:
      type: object
      additionalProperties: false
      required: [id, providerId, modelName, displayName, contextWindow, maxOutputTokens, inputCostUsdMicrosPerMillion, outputCostUsdMicrosPerMillion, supportsVision, supportsToolUse, supportsThinking, thinkingDialect, supportedThinkingEfforts, isDefault, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        providerId: { type: string }
        modelName: { type: string }
        displayName: { type: string }
        contextWindow: { type: integer }
        maxOutputTokens: { type: integer }
        inputCostUsdMicrosPerMillion: { type: integer, minimum: 0, maximum: 1000000000 }
        outputCostUsdMicrosPerMillion: { type: integer, minimum: 0, maximum: 1000000000 }
        supportsVision: { type: boolean }
        supportsToolUse: { type: boolean }
        supportsThinking: { type: boolean }
        thinkingDialect: { $ref: "#/components/schemas/ThinkingDialect" }
        supportedThinkingEfforts:
          type: array
          items: { $ref: "#/components/schemas/ThinkingEffort" }
        isDefault: { type: boolean }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PolicyProfile:
      type: object
      required: [id, name, kind, version, config, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [tool, turn, vision, compaction] }
        version: { type: integer }
        config: { type: object, additionalProperties: true }
        status: { type: string, enum: [active, inactive] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ImageArtifact:
      type: object
      required: [id, projectId, name, kind, mimeType, sizeBytes, sha256, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        sessionId: { type: string }
        name: { type: string }
        kind: { type: string, enum: [image, image_attachment] }
        mimeType: { type: string, enum: [image/png, image/jpeg, image/gif] }
        sizeBytes: { type: integer, format: int64 }
        sha256: { type: string }
        width: { type: integer }
        height: { type: integer }
        createdAt: { type: string, format: date-time }
    ArtifactReference:
      type: object
      required: [artifactId, name, kind, mimeType, sizeBytes, sha256]
      additionalProperties: false
      properties:
        artifactId: { type: string }
        name: { type: string }
        kind: { type: string, enum: [image, table, static_html, text, file] }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        sha256: { type: string }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
    Artifact:
      type: object
      required: [id, projectId, name, kind, mimeType, sizeBytes, sha256, retentionClass, createdAt]
      additionalProperties: false
      properties:
        id: { type: string }
        projectId: { type: string }
        sessionId: { type: string }
        messageId: { type: string }
        runId: { type: string }
        name: { type: string }
        kind: { type: string, enum: [image, image_attachment, table, static_html, text, file] }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        sha256: { type: string }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        sourceToolCallId: { type: string }
        sourceKind: { type: string }
        retentionClass: { type: string, enum: [project] }
        createdAt: { type: string, format: date-time }
    TablePreview:
      type: object
      required: [format, columns, rows, truncatedRows, truncatedColumns, rowLimit, columnLimit]
      additionalProperties: false
      properties:
        format: { type: string, enum: [csv, tsv, xlsx] }
        sheets:
          type: array
          items: { type: string }
        sheet: { type: string }
        columns:
          type: array
          maxItems: 30
          items: { type: string }
        rows:
          type: array
          maxItems: 100
          items:
            type: array
            maxItems: 30
            items: { type: string }
        truncatedRows: { type: boolean }
        truncatedColumns: { type: boolean }
        rowLimit: { type: integer, const: 100 }
        columnLimit: { type: integer, const: 30 }
    TextPreview:
      type: object
      required: [text, truncated]
      additionalProperties: false
      properties:
        text: { type: string }
        truncated: { type: boolean }
    TurnContentPart:
      oneOf:
        - type: object
          required: [type, text]
          additionalProperties: false
          properties:
            type: { type: string, const: text }
            text: { type: string, minLength: 1 }
        - type: object
          required: [type, artifactId]
          additionalProperties: false
          properties:
            type: { type: string, const: image }
            artifactId: { type: string }
    InvocationTarget:
      oneOf:
        - $ref: "#/components/schemas/HostInvocationTarget"
        - $ref: "#/components/schemas/RoleInvocationTarget"
      discriminator:
        propertyName: kind
        mapping:
          host: "#/components/schemas/HostInvocationTarget"
          role: "#/components/schemas/RoleInvocationTarget"
    HostInvocationTarget:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, const: host }
    RoleInvocationTarget:
      type: object
      additionalProperties: false
      required: [kind, objectId, versionId, contextMode]
      properties:
        kind: { type: string, const: role }
        objectId: { type: string }
        versionId: { type: string }
        contextMode: { type: string, enum: [room, fresh, reply_to] }
        replyTo:
          type: array
          uniqueItems: true
          items: { type: string }
    Project:
      type: object
      required: [id, name, description, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectWorkspace:
      type: object
      required: [id, projectId, kind, hostPath, virtualPath, status, pathFingerprint, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        kind: { type: string, enum: [local] }
        hostPath: { type: string }
        virtualPath: { type: string, const: /workspace }
        status: { type: string }
        pathFingerprint: { type: string }
        createdAt: { type: string, format: date-time }
    WorkspaceFileEntry:
      type: object
      required: [name, path, isDir, size, modifiedAt]
      additionalProperties: false
      properties:
        name: { type: string }
        path: { type: string, pattern: ^/workspace(?:/|$) }
        isDir: { type: boolean }
        size: { type: integer, format: int64, minimum: 0 }
        modifiedAt: { type: string, format: date-time }
    Session:
      type: object
      additionalProperties: false
      required: [id, projectId, title, status, mode, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        title: { type: string }
        status: { type: string, enum: [active, archived] }
        mode: { type: string, enum: [hosted, room] }
        activeLeafMessageId: { type: string }
        activeBranchId: { type: string }
        defaultAgentProfileId: { type: string }
        defaultModelProfileId: { type: string }
        compactionPolicyProfileId: { type: string }
        sourceSessionId: { type: string }
        sourceMessageId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SessionBranch:
      type: object
      required: [id, sessionId, label, messageCount, active, createdAt, updatedAt]
      properties:
        id: { type: string }
        sessionId: { type: string }
        parentBranchId: { type: string }
        forkMessageId: { type: string }
        leafMessageId: { type: string }
        label: { type: string }
        messageCount: { type: integer, minimum: 0 }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BranchNavigation:
      type: object
      required: [session, branches]
      properties:
        session: { $ref: "#/components/schemas/Session" }
        branches:
          type: array
          items: { $ref: "#/components/schemas/SessionBranch" }
    SessionMessagePage:
      type: object
      required: [messages, hasMore]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        nextCursor: { type: string }
        hasMore: { type: boolean }
        activeLeafMessageId: { type: string }
    SpeakerSnapshot:
      type: object
      additionalProperties: false
      properties:
        kind: { type: string, enum: [user, host, role, workflow, room, system] }
        objectId: { type: string }
        versionId: { type: string }
        handle: { type: string }
        displayName: { type: string }
        icon: { type: string }
        color: { type: string }
        positioning: { type: string }
        configDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
    Message:
      type: object
      additionalProperties: false
      required: [id, sessionId, role, status, speakerKind, speakerSnapshot, visibility, parts, createdAt]
      properties:
        id: { type: string }
        sessionId: { type: string }
        parentMessageId: { type: string }
        role: { type: string, enum: [system, user, assistant, tool] }
        status: { type: string }
        runId: { type: string }
        speakerKind: { type: string, enum: [user, host, role, workflow, room, system] }
        speakerObjectId: { type: string }
        speakerVersionId: { type: string }
        participantInstanceId: { type: string }
        speakerSnapshot: { $ref: "#/components/schemas/SpeakerSnapshot" }
        addresseeKind: { type: string, enum: [host, room, role, graph, workflow] }
        addresseeObjectId: { type: string }
        addresseeVersionId: { type: string }
        replyToMessageId: { type: string }
        visibility: { type: string, enum: [public, private, room_control, legacy_execution] }
        originatedAt: { type: string, format: date-time }
        parts:
          type: array
          items: { $ref: "#/components/schemas/MessageContentBlock" }
        createdAt: { type: string, format: date-time }
        seq: { type: integer, format: int64, description: "Session-monotonic message sequence; 0 for legacy rows pending backfill" }
    MessageContentBlock:
      oneOf:
        - $ref: "#/components/schemas/TextContentBlock"
        - $ref: "#/components/schemas/ThinkingContentBlock"
        - $ref: "#/components/schemas/ToolCallContentBlock"
        - $ref: "#/components/schemas/ToolResultContentBlock"
        - $ref: "#/components/schemas/ImageContentBlock"
        - $ref: "#/components/schemas/ImageDescriptionContentBlock"
        - $ref: "#/components/schemas/RoomControlContentBlock"
    RoomControlContentBlock:
      type: object
      required: [type, roomControl]
      additionalProperties: false
      properties:
        type: { type: string, const: room_control }
        roomControl:
          type: object
          required: [action, participantInstanceId, objectId, objectVersionId, displaySnapshot]
          additionalProperties: false
          properties:
            action: { type: string, enum: [participant_invited] }
            participantInstanceId: { type: string }
            objectId: { type: string }
            objectVersionId: { type: string }
            displaySnapshot: { $ref: "#/components/schemas/SpeakerSnapshot" }
    TextContentBlock:
      type: object
      required: [type, text]
      additionalProperties: false
      properties:
        type: { type: string, const: text }
        text: { type: string }
    ThinkingContentBlock:
      type: object
      required: [type, text]
      additionalProperties: false
      properties:
        type: { type: string, const: thinking }
        text: { type: string }
    ToolCallContentBlock:
      type: object
      required: [type, toolCall]
      additionalProperties: false
      properties:
        type: { type: string, const: tool_call }
        toolCall:
          type: object
          required: [id, name, arguments]
          additionalProperties: false
          properties:
            id: { type: string }
            name: { type: string }
            arguments: { type: object, additionalProperties: true }
            argumentsFragment: { type: string }
            partial: { type: boolean }
    ToolResultContentBlock:
      type: object
      required: [type, toolResult]
      additionalProperties: false
      properties:
        type: { type: string, const: tool_result }
        toolResult:
          type: object
          required: [toolCallId, toolName, content, isError]
          additionalProperties: false
          properties:
            toolCallId: { type: string }
            toolName: { type: string }
            content: { type: string }
            isError: { type: boolean }
            artifacts:
              type: array
              items: { $ref: "#/components/schemas/ArtifactReference" }
    ImageContentBlock:
      type: object
      required: [type, image]
      additionalProperties: false
      properties:
        type: { type: string, const: image }
        image:
          type: object
          required: [artifactId, mimeType, sha256, width, height]
          additionalProperties: false
          properties:
            artifactId: { type: string }
            mimeType: { type: string }
            sha256: { type: string }
            width: { type: integer }
            height: { type: integer }
    ImageDescriptionContentBlock:
      type: object
      required: [type, imageDescription]
      additionalProperties: false
      properties:
        type: { type: string, const: image_description }
        imageDescription:
          type: object
          required: [artifactId, text, modelId, promptVersion]
          additionalProperties: false
          properties:
            artifactId: { type: string }
            text: { type: string }
            modelId: { type: string }
            promptVersion: { type: string }
    RunEvent:
      type: object
      required: [eventId, runId, seq, type, payload, createdAt]
      properties:
        eventId: { type: integer, format: int64 }
        runId: { type: string }
        seq: { type: integer, format: int64 }
        type:
          type: string
          enum:
            - run_queued
            - run_started
            - context_warning
            - context_pruned
            - context_compaction_planned
            - context_compaction_started
            - context_compaction_retry_scheduled
            - context_compaction_retry_started
            - context_compaction_completed
            - context_compaction_failed
            - context_compaction_cancelled
            - context_checkpoint_selected
            - context_checkpoint_invalid
            - context_overflow_recovery_started
            - context_overflow_recovery_completed
            - run_context_compaction_planned
            - run_context_compaction_started
            - run_context_compaction_retry_scheduled
            - run_context_compaction_completed
            - run_context_compaction_failed
            - run_context_compaction_cancelled
            - model_route_selected
            - model_call_started
            - vision_fallback_started
            - vision_description_delta
            - vision_fallback_attempt_failed
            - vision_fallback_completed
            - vision_fallback_failed
            - model_call_attempt_failed
            - model_call_retry_scheduled
            - text_delta
            - thinking_delta
            - tool_call_delta
            - usage_updated
            - model_call_completed
            - model_call_failed
            - output_truncated
            - tool_call_started
            - tool_call_completed
            - tool_call_failed
            - tool_call_skipped
            - tool_policy_denied
            - tool_policy_terminated
            - tool_result_projected
            - approval_requested
            - approval_resolved
            - turn_stop_requested
            - stuck_tool_loop
            - message_committed
            - run_transcript_committed
            - run_succeeded
            - run_failed
            - run_cancelled
            - run_interrupted
        payload: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    RunMessage:
      type: object
      additionalProperties: false
      required: [id, runId, ordinal, role, content, visibility, createdAt]
      properties:
        id: { type: string }
        runId: { type: string }
        ordinal: { type: integer, minimum: 0 }
        role: { type: string, enum: [system, user, assistant, tool] }
        content:
          type: array
          items: { $ref: "#/components/schemas/MessageContentBlock" }
        visibility: { type: string, enum: [private, public] }
        createdAt: { type: string, format: date-time }
    RunMessagePage:
      type: object
      additionalProperties: false
      required: [runId, formatVersion, source, digest, messages, hasMore]
      properties:
        runId: { type: string }
        formatVersion: { type: integer, enum: [1, 2] }
        source: { type: string, enum: [shadow, legacy] }
        digest: { type: string }
        messages:
          type: array
          items: { $ref: "#/components/schemas/RunMessage" }
        hasMore: { type: boolean }
        nextBeforeOrdinal: { type: integer, minimum: 0 }
    ImmutableFileRevision:
      type: object
      additionalProperties: false
      required: [schemaVersion, resourceId, version, digest, publishedAt]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        resourceId: { type: string }
        version: { type: integer, minimum: 1 }
        digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        publishedAt: { type: string, format: date-time }
    GlobalRoleSummary:
      type: object
      additionalProperties: false
      required: [id, name, path]
      properties:
        id: { type: string }
        name: { type: string }
        path: { type: string }
        digest: { type: string }
        error: { type: string }
    PortableRoleDocument:
      type: object
      additionalProperties: false
      required: [schemaVersion, handle, name, description, positioning, icon, color, model, skills, authority, permissionCeiling, allowedTools, context, delegation, outputContract, maxLoopIterations, prompt]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        handle: { type: string, pattern: "^[a-z][a-z0-9_-]{1,31}$" }
        name: { type: string, minLength: 1 }
        description: { type: string }
        positioning: { type: string }
        icon: { type: string }
        color: { type: string }
        model:
          type: object
          additionalProperties: false
          required: [ref, thinkingEffort, fallbacks]
          properties:
            ref: { type: string, pattern: "^[^/]+/[^/]+$" }
            thinkingEffort: { $ref: "#/components/schemas/ThinkingEffort" }
            fallbacks: { type: array, uniqueItems: true, items: { type: string } }
        skills:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, mode]
            properties:
              id: { type: string }
              mode: { type: string, enum: [preload, available] }
        authority: { type: string, enum: [read_only, write_workspace] }
        permissionCeiling: { type: string, enum: [discuss, ask, auto] }
        allowedTools: { type: array, uniqueItems: true, items: { type: string } }
        context:
          type: object
          additionalProperties: false
          required: [defaultMode, allowedModes, ownExecutionContinuity]
          properties:
            defaultMode: { type: string, enum: [room, fresh] }
            allowedModes: { type: array, uniqueItems: true, items: { type: string, enum: [room, fresh] } }
            ownExecutionContinuity: { type: string, enum: [none] }
        delegation:
          type: object
          additionalProperties: false
          required: [admission, allowedCallerKinds, allowedStrategies, maxInvocationsPerParentRun, maxConcurrentInstances, budgetCeiling]
          properties:
            admission: { type: string, enum: [auto_within_budget, approval_required, deny] }
            allowedCallerKinds: { type: array, uniqueItems: true, items: { type: string } }
            allowedStrategies: { type: array, uniqueItems: true, items: { type: string } }
            maxInvocationsPerParentRun: { type: integer, minimum: 1 }
            maxConcurrentInstances: { type: integer, minimum: 1 }
            budgetCeiling:
              type: object
              additionalProperties: false
              required: [maxModelCalls, maxToolCalls, maxTotalTokens, maxOutputTokens, maxCostUsdMicros, maxWallTimeMs]
              properties:
                maxModelCalls: { type: integer, minimum: 1 }
                maxToolCalls: { type: integer, minimum: 0 }
                maxTotalTokens: { type: integer, minimum: 1 }
                maxOutputTokens: { type: integer, minimum: 1 }
                maxCostUsdMicros: { type: integer, minimum: 0 }
                maxWallTimeMs: { type: integer, minimum: 1 }
        outputContract: { type: string }
        maxLoopIterations: { type: integer, minimum: 1 }
        prompt: { type: string, minLength: 1, maxLength: 65536 }
    GlobalRoleDetail:
      allOf:
        - $ref: "#/components/schemas/GlobalRoleSummary"
        - type: object
          required: [digest, document]
          properties:
            digest: { type: string }
            document: { $ref: "#/components/schemas/PortableRoleDocument" }
    ResolvedGlobalRole:
      type: object
      additionalProperties: false
      required: [roleId, source, revision, document]
      properties:
        roleId: { type: string }
        source: { type: string }
        revision: { $ref: "#/components/schemas/ImmutableFileRevision" }
        document: { $ref: "#/components/schemas/PortableRoleDocument" }
    GraphTask:
      type: object
      additionalProperties: false
      required: [name, goal]
      description: Role-backed Tasks declare role only; inline Tasks declare model with optional thinking and skills. The modes are mutually exclusive and enforced by the Worker.
      properties:
        name: { type: string, minLength: 1 }
        role: { type: string, pattern: "^(local|global)/[a-z][a-z0-9_-]{1,63}$" }
        model: { type: string, pattern: "^[^/]+/[^/]+$" }
        thinking: { $ref: "#/components/schemas/ThinkingEffort" }
        skills: { type: array, uniqueItems: true, items: { type: string, pattern: "^(local|global)/[a-z][a-z0-9_-]{1,63}$" } }
        goal: { type: string, minLength: 1 }
        writes: { type: array, uniqueItems: true, items: { type: string } }
        budget:
          type: object
          additionalProperties: false
          properties: { tokens: { type: integer, minimum: 1 } }
    GraphDocument:
      type: object
      additionalProperties: false
      required: [schemaVersion, id, name, tasks, graph]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        id: { type: string }
        name: { type: string }
        description: { type: string }
        tasks: { type: object, additionalProperties: { $ref: "#/components/schemas/GraphTask" } }
        graph:
          type: object
          additionalProperties: { type: array, uniqueItems: true, items: { type: string } }
    GraphSummary:
      type: object
      additionalProperties: false
      required: [id, name, path, latestVersion]
      properties:
        id: { type: string }
        name: { type: string }
        path: { type: string }
        digest: { type: string }
        error: { type: string }
        latestVersion: { type: integer, minimum: 0 }
    GraphDetail:
      allOf:
        - $ref: "#/components/schemas/GraphSummary"
        - type: object
          required: [digest, document]
          properties:
            digest: { type: string }
            document: { $ref: "#/components/schemas/GraphDocument" }
    GraphMutation:
      type: object
      additionalProperties: false
      required: [expectedDigest]
      properties:
        expectedDigest: { type: string }
        name: { type: string }
        description: { type: string }
        task:
          type: object
          additionalProperties: false
          required: [id]
          properties:
            id: { type: string }
            value: { $ref: "#/components/schemas/GraphTask" }
        dependencies:
          type: object
          additionalProperties: false
          required: [taskId, depends]
          properties:
            taskId: { type: string }
            depends: { type: array, uniqueItems: true, items: { type: string } }
    GraphBuilderMessage:
      type: object
      additionalProperties: false
      required: [id, graphId, ordinal, role, content, createdAt]
      properties:
        id: { type: string }
        graphId: { type: string }
        ordinal: { type: integer, minimum: 1 }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        createdAt: { type: string, format: date-time }
    GraphBuilderOperation:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [upsert_task, delete_task, set_dependencies, update_graph] }
        taskId: { type: string }
        task: { $ref: "#/components/schemas/GraphTask" }
        depends: { type: array, items: { type: string } }
        name: { type: string }
        description: { type: string }
    GraphBuilderProposal:
      type: object
      additionalProperties: false
      required: [id, graphId, baseDigest, operations, summary, status, diagnostics, createdAt]
      properties:
        id: { type: string }
        graphId: { type: string }
        baseDigest: { type: string }
        operations: { type: array, items: { $ref: "#/components/schemas/GraphBuilderOperation" } }
        summary: { type: string }
        status: { type: string, enum: [pending, applied, superseded] }
        diagnostics: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
    GraphBuilderThread:
      type: object
      additionalProperties: false
      required: [graphId, messages]
      properties:
        graphId: { type: string }
        modelProfileId: { type: string }
        messages: { type: array, items: { $ref: "#/components/schemas/GraphBuilderMessage" } }
        proposal: { $ref: "#/components/schemas/GraphBuilderProposal" }
    RoleScope:
      type: string
      enum: [builtin, global, project, flow]
    RoleModelBinding:
      type: object
      additionalProperties: false
      required: [mode, thinkingEffort, fallbackModelProfileIds, overridableFields]
      properties:
        mode: { type: string, enum: [fixed, overridable, inherit] }
        modelProfileId: { type: string }
        thinkingEffort: { $ref: "#/components/schemas/ThinkingEffort" }
        fallbackModelProfileIds: { type: array, uniqueItems: true, items: { type: string } }
        overridableFields: { type: array, uniqueItems: true, items: { type: string } }
    RoleSkillEntry:
      type: object
      additionalProperties: false
      required: [skillId, mode]
      properties:
        skillId: { type: string }
        mode: { type: string, enum: [preload, available] }
    SubmitResult:
      type: object
      additionalProperties: false
      required: [status, summary]
      properties:
        status: { type: string, enum: [completed, blocked, needs_input] }
        summary: { type: string }
        artifactRefs:
          type: array
          items: { type: object }
        payload: { type: object }
    DelegationBudgetCeiling:
      type: object
      additionalProperties: false
      required: [maxModelCalls, maxToolCalls, maxTotalTokens, maxOutputTokens, maxCostUsdMicros, maxWallTimeMs]
      properties:
        maxModelCalls: { type: integer, minimum: 0 }
        maxToolCalls: { type: integer, minimum: 0 }
        maxTotalTokens: { type: integer, format: int64, minimum: 0 }
        maxOutputTokens: { type: integer, format: int64, minimum: 0 }
        maxCostUsdMicros: { type: integer, format: int64, minimum: 0 }
        maxWallTimeMs: { type: integer, format: int64, minimum: 0 }
    RoleDelegationPolicy:
      type: object
      additionalProperties: false
      required: [admission, allowedCallerKinds, allowedStrategies, maxInvocationsPerParentRun, maxConcurrentInstances, budgetCeiling]
      properties:
        admission: { type: string, enum: [denied, approval_required, auto_within_budget] }
        allowedCallerKinds:
          type: array
          uniqueItems: true
          items: { type: string, enum: [host] }
        allowedStrategies:
          type: array
          uniqueItems: true
          items: { type: string, enum: [single, parallel] }
        maxInvocationsPerParentRun: { type: integer, minimum: 0 }
        maxConcurrentInstances: { type: integer, minimum: 0 }
        budgetCeiling: { $ref: "#/components/schemas/DelegationBudgetCeiling" }
    RoleContextPolicy:
      type: object
      additionalProperties: false
      required: [defaultMode, allowedModes, ownExecutionContinuity]
      properties:
        defaultMode: { type: string, enum: [room, reply, fresh, task_only] }
        allowedModes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [room, reply, fresh, task_only] }
        ownExecutionContinuity: { type: string, enum: [none] }
    RoleDefinition:
      type: object
      additionalProperties: false
      required: [schemaVersion, rolePrompt, modelBinding, skills, authority, permissionCeiling, allowedTools,
        contextPolicy, delegationPolicy, outputContract, maxLoopIterations]
      properties:
        schemaVersion: { type: integer, enum: [1] }
